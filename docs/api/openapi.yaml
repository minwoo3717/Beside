        skipped:
          type: integer
          description: (jobId, device, e2eMs) 가 이미 있어 건너뛴 행 수
        errors:
          type: array
          description: 저장하지 못한 줄. 줄 번호 오름차순.
          items:
            $ref: '#/components/schemas/AdminImportError'
    AdminImportError:
      type: object
      required: [line, reason]
      properties:
        line:
          type: integer
          description: 파일의 줄 번호(헤더 = 1). 따옴표 안 줄바꿈으로 여러 줄인 행은 시작 줄.
        reason:
          type: string
          description: "개발자용 설명(영문), 예 `avgFps is not a number: 'abc'`"
    AdminE2eRow:
      type: object
      description: |
        앱 측정 한 행 + 그 작업의 마지막 COMPLETED 실행. 이름·순서는 adminE2e 설명(CSV 헤더와 같다). 앱 열은 METRICS §3,
        서버·추론 열은 METRICS §1·§2 이름이고 서버 uploadMs 만 serverUploadMs 다. 실행이 없으면 서버·추론 열은 null.
      required: [jobId, uploadMs, waitMs, downloadMs, loadMs, e2eMs, avgFps, minFps, memMB]
      properties:
        jobId:
          type: string
        modelVersion:
          type: string
          nullable: true
        workerType:
          type: string
          nullable: true
        passthrough:
          type: boolean
          nullable: true
        attempt:
          type: integer
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        uploadBytes:
          type: integer
          format: int64
          nullable: true
        serverUploadMs:
          type: integer
          format: int64
          nullable: true
          description: 서버 uploadMs(METRICS §1 — 요청 도착 → 사진 저장). 앱 uploadMs 와 다른 값이다.
        queuedMs:
          type: integer
          format: int64
          nullable: true
        processingMs:
          type: integer
          format: int64
          nullable: true
        totalMs:
          type: integer
          format: int64
          nullable: true
        inferMs:
          type: integer
          format: int64
          nullable: true
        gpuPeakMB:
          type: integer
          format: int64
          nullable: true
        modelParams:
          type: integer
          format: int64
          nullable: true
        outputVertices:
          type: integer
          format: int64
          nullable: true
        outputTriangles:
          type: integer
          format: int64
          nullable: true
        convertMs:
          type: integer
          format: int64
          nullable: true
        glbBytes:
          type: integer
          format: int64
          nullable: true
        uploadMs:
          type: integer
          format: int64
          description: 앱 uploadMs(METRICS §3 — POST 시작 → 202 수신)
        waitMs:
          type: integer
          format: int64
        downloadMs:
          type: integer
          format: int64
        loadMs:
          type: integer
          format: int64
        e2eMs:
          type: integer
          format: int64
        avgFps:
          type: number
          format: double
        minFps:
          type: number
          format: double
        memMB:
          type: integer
          format: int64
        device:
          type: string
          nullable: true
    PetResponse:
      type: object
      description: 보관함의 반려동물 한 마리(tag pets).
      required: [id, name, species, createdAt, updatedAt, jobCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        species:
          type: string
          description: 종. 클라이언트는 알 수 없는 값을 받으면 크래시 대신 UNKNOWN 으로 처리한다.
          enum: [DOG, CAT, OTHER]
        note:
          type: string
          nullable: true
          maxLength: 500
          description: 메모. 없으면 null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: 이름·종·메모·대표를 마지막으로 바꾼 시각 (ISO 8601, UTC)
        jobCount:
          type: integer
          format: int32
          description: 이 펫에 들어 있는 작업 수(상태와 관계없이)
        coverJobId:
          type: string
          format: uuid
          nullable: true
          description: |
            대표 모델. updatePet 으로 고른 작업이 아직 이 펫의 COMPLETED 작업이면 그것, 아니면 이 펫의 가장 최근(createdAt)
            COMPLETED 작업, 그것도 없으면 null.
        latestJobAt:
          type: string
          format: date-time
          nullable: true
          description: 이 펫의 가장 최근 작업의 createdAt. 작업이 없으면 null.
    PetListResponse:
      type: object
      description: GET /api/v1/pets. 추가한 순서(createdAt 오름차순).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PetResponse'
    PetDetailResponse:
      description: GET /api/v1/pets/{petId}. PetResponse 의 모든 필드와 생성 기록.
      allOf:
        - $ref: '#/components/schemas/PetResponse'
        - type: object
          required: [jobs, modelVersions]
          properties:
            jobs:
              type: array
              description: 이 펫의 작업, createdAt 최신순.
              items:
                $ref: '#/components/schemas/JobResponse'
            modelVersions:
              type: object
              description: |
                jobId → 그 작업의 마지막으로 끝난 실행(attempt 가 가장 큰 job_runs 행)의 modelVersion.
                끝난 실행이 없거나 modelVersion 이 없는 작업은 키가 없다.
              additionalProperties:
                type: string
    CreatePetRequest:
      type: object
      description: POST /api/v1/pets 본문.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: 앞뒤 공백을 뺀 뒤 1~40자
        species:
          type: string
          enum: [DOG, CAT, OTHER]
          default: DOG
        note:
          type: string
          nullable: true
          maxLength: 500
          description: 500자 이하. 생략하거나 빈 값이면 null.
    UpdatePetRequest:
      type: object
      description: PATCH /api/v1/pets/{petId} 본문. 보낸 필드만 바꾼다(JSON merge patch 처럼).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: 앞뒤 공백을 뺀 뒤 1~40자. null 불가.
        species:
          type: string
          enum: [DOG, CAT, OTHER]
          description: null 불가.
        note:
          type: string
          nullable: true
          maxLength: 500
          description: null 이나 빈 값이면 메모를 지운다.
        coverJobId:
          type: string
          format: uuid
          nullable: true
          description: 대표로 고를 이 펫의 COMPLETED 작업. null 이면 자동(가장 최근 COMPLETED 작업).
    JobPetRequest:
      type: object
      description: PUT /api/v1/jobs/{jobId}/pet 본문. petId 필드는 꼭 보낸다(null 이면 미분류로).
      required: [petId]
      properties:
        petId:
          type: string
          format: uuid
          nullable: true
          description: 넣을 반려동물. null 이면 펫에서 빼서 미분류로.
    ProductEventBatch:
      type: object
      description: |
        POST /api/v1/events 본문(tag events). 한 세션의 이벤트 1~50개. 개인을 알아볼 값은 넣지 않는다: installId 는 앱이 설치 때 만든
        난수 UUID(기기 ID·광고 ID 가 아님), sessionId 는 앱을 켤 때마다(웹은 페이지를 열 때마다) 새로 만든 UUID다.
        여기 없는 필드는 서버가 읽지 않는다.
      required: [installId, sessionId, appVersion, platform, events]
      properties:
        installId:
          type: string
          format: uuid
          description: 설치마다 한 번 만든 난수 UUID (앱 PlayerPrefs beside.installId, 웹 localStorage)
        sessionId:
          type: string
          format: uuid
          description: 앱 실행(웹은 페이지 열기)마다 새로 만든 UUID
        appVersion:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[0-9A-Za-z._+-]{1,32}$'
          description: 앱 버전(Unity Application.version), 웹은 `web`
          example: 0.4.0
        platform:
          type: string
          enum: [android, web]
          description: android = Unity 앱(에디터 포함), web = 공유 뷰어(/s/{token})
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProductEvent'
    ProductEvent:
      type: object
      description: 이벤트 하나. 이름별 props 는 props 설명과 docs/METRICS.md §6.1 표.
      required: [name, at, seq]
      properties:
        name:
          type: string
          enum: [screen_view, photos_selected, generate_tap, job_cancel_tap, job_failed_shown, model_ready, fur_toggle,
                 ar_issue_shown, model_placed, animation_play, photo_saved, start_over]
          description: 이벤트 이름. 목록에 없는 이름은 서버가 버리고 dropped 로 센다(400 이 아님).
        at:
          type: string
          format: date-time
          description: 클라이언트 시계로 이벤트가 일어난 시각 (ISO 8601, UTC 권장)
        seq:
          type: integer
          format: int32
          minimum: 0
          description: 세션 안에서 0 부터 하나씩 늘린 번호. 같은 sessionId·seq 는 한 번만 저장한다(다시 보낸 묶음).
        jobId:
          type: string
          format: uuid
          nullable: true
          description: 이벤트가 관계된 작업(있을 때만). UUID 가 아니면 이 값만 버린다.
        screen:
          type: string
          nullable: true
          enum: [home, confirm, progress, preview, ar, error, settings, share]
          description: |
            이벤트가 일어난 화면. screen_view 에서는 보여 준 화면이며 꼭 있어야 한다(없으면 그 이벤트를 버림).
            앱 화면 7개(Unity DesignedUIController.Page 이름의 소문자)와 웹 공유 뷰어 share. 목록에 없는 값은 이 값만 버린다.
        props:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            이름별 속성. 값은 아래 enum·정수·불리언만이고 그 밖의 키·값은 서버가 버린다(이벤트는 저장).
            screen_view: 없음(화면은 screen) · photos_selected: source(gallery|camera), count(0~10, 10 = 10장 이상, 0 = 고르지 않고 닫음) ·
            generate_tap: mode(new|resume|retry), photoCount(0~10) · job_cancel_tap: stage(uploading|queued|processing|downloading|loading),
            elapsedSec(0~86400) · job_failed_shown: code(ERROR_CODES.md 의 코드 또는 앱 코드 NETWORK_ERROR·BAD_RESPONSE·DOWNLOAD_FAILED·
            FILE_CORRUPT·LOAD_FAILED·WAIT_TIMEOUT), retryable(bool) · model_ready: cached(bool), loadMs(0~3600000), waitMs(0~3600000) ·
            fur_toggle: on(bool) · ar_issue_shown: issue(CameraDenied|Unsupported|NeedsInstall|SessionError|NoPlane) ·
            model_placed: method(tap|center), secSinceArEnter(0~86400) · animation_play: clip(Walk|Sit|TailWag|HeadTilt|Idle) ·
            photo_saved: 없음 · start_over: from(preview|ar|error).
    ProductEventsAccepted:
      type: object
      description: POST /api/v1/events 의 202 결과.
      required: [accepted, dropped]
      properties:
        accepted:
          type: integer
          format: int32
          description: 저장한 이벤트 수(속성 일부만 버린 이벤트 포함)
        dropped:
          type: integer
          format: int32
          description: 버린 이벤트 수(모르는 이름·형식 오류·중복·서버 요청 수 상한)
    AdminProductEvent:
      type: object
      description: 제품 이벤트 내보내기 한 행. 이름과 순서는 adminEvents 설명(CSV 헤더와 같다).
      required: [receivedAt, env, platform, appVersion, installId, sessionId, seq, at, name]
      properties:
        receivedAt:
          type: string
          format: date-time
          description: 서버가 받은 시각
        env:
          type: string
          description: 지표 환경(local | prod | loadtest, 서버 설정 management.metrics.tags.env)
        platform:
          type: string
        appVersion:
          type: string
        installId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        seq:
          type: integer
          format: int32
        at:
          type: string
          format: date-time
        name:
          type: string
        screen:
          type: string
          nullable: true
        jobId:
          type: string
          format: uuid
          nullable: true
        props:
          type: object
          nullable: true
          additionalProperties: true
          description: 저장한 속성(검사를 통과한 것만). 없으면 null.
    AdminFunnel:
      type: object
      description: GET /api/v1/admin/funnel. 계산 방법은 adminFunnel 설명.
      required: [sessions, steps]
      properties:
        from:
          type: string
          format: date-time
          nullable: true
          description: 요청한 from(없으면 null)
        to:
          type: string
          format: date-time
          nullable: true
          description: 요청한 to(없으면 null)
        sessions:
          type: integer
          format: int64
          description: 기간 안에 이벤트가 하나라도 있는 서로 다른 세션 수
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AdminFunnelStep'
    AdminFunnelStep:
      type: object
      description: 퍼널 한 단계.
      required: [step, event, sessions, conversionPct]
      properties:
        step:
          type: string
          description: 단계 이름(home, photos_selected, generate_tap, model_ready, ar, model_placed)
        event:
          type: string
          description: 세는 이벤트, 예 `screen_view(screen=ar)`
        sessions:
          type: integer
          format: int64
        conversionPct:
          type: number
          format: double
          description: 첫 단계 세션 대비 % (0~100)
        fromPrevPct:
          type: number
          format: double
          nullable: true
          description: 바로 앞 단계 세션 대비 %. 첫 단계는 null.
        medianSecondsFromPrev:
          type: number
          format: double
          nullable: true
          description: 앞 단계에서 이 단계까지 걸린 초의 중앙값(nearest-rank). 첫 단계·세션 0 이면 null.
