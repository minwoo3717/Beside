            필드: `state`(UNKNOWN | UP | LOADING | DOWN — 모르는 값은 무시), `device`(cuda | cpu | null), `checkedAt`·`since`
            (ISO 8601, since = 지금 상태가 시작된 시각), `detail`(짧은 설명, 서버 주소·경로 없음). mock 에서는 null 이고
