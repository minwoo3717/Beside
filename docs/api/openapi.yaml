        modelVersion:
          type: string
          nullable: true
          description: 이 작업의 마지막으로 끝난 실행(attempt 가 가장 큰 job_runs 행)의 modelVersion. 끝난 실행이 없거나 값이 없으면 null.
    JobQueue:
      type: object
      description: |
        대기열 위치(status=PENDING 일 때만). 앱은 "앞에 {ahead}명" 처럼 보여 준다.
        real 은 GPU 1장에서 한 번에 1건만 생성하고(inference.max-concurrency=1) 나머지는 접수(또는 retry) 순서로 기다린다.
        mock 도 같은 식으로 계산한다(mock 은 실제로는 작업을 동시에 처리하므로 화면 확인용 값이다).
      required: [ahead]
      properties:
        ahead:
          type: integer
          format: int32
          minimum: 0
          description: |
            이 작업보다 먼저 처리될 작업 수. 지금 생성 중(PROCESSING)인 작업을 포함한다. 0 이면 바로 다음 차례.
            대기열 상한(api-v1.1)을 켠 서버에서는 상한이 세는 것과 같은 PENDING 작업만 센다: queuedAt 이
            admission.stale-after-ms 보다 오래된 PENDING(돌릴 워커가 없는 작업)은 빼고, 이 작업 자신이 그보다 오래됐으면
            앞의 작업을 모두 센다. 그래서 상한 N 인 서버에서 접수된 작업의 ahead 는 많아야 N − 1 + 생성 중인 작업 수다.
        reason:
          type: string
          nullable: true
          description: |
            평소보다 오래 기다릴 수 있는 이유. 현재 값은 `INFERENCE_OFFLINE`(GPU 추론 서비스가 꺼져 있거나 모델을 불러오는 중,
            real 만) 또는 null. enum 이 아닌 문자열이며 클라이언트는 모르는 값을 무시한다.
          example: INFERENCE_OFFLINE
    JobEstimate:
      type: object
      description: |
        남은 시간 추정치(status=PENDING·PROCESSING 일 때만). 보장값이 아니므로 앱은 "약 N분" 처럼 보여 준다.
        최근 완료 실행(같은 워커 종류, status=COMPLETED, 패스스루 제외, 최근 20건)의 processingMs 중앙값 기준이고,
        GPU 1장(한 번에 1건) 기준으로 계산한다.
        PENDING: 중앙값 × (queue.ahead + 1) − 지금 생성 중인 작업이 이미 쓴 시간(작업마다 중앙값까지만 뺀다).
        PROCESSING: 중앙값 − 이 작업의 경과, 0 이상(0 이면 평소보다 오래 걸리는 중).
        queue.reason=INFERENCE_OFFLINE 일 때 GPU 가 돌아올 때까지의 시간은 넣지 않는다.
      required: [basedOnRuns]
      properties:
        remainingMs:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: 이 작업이 끝날 때까지 남은 시간 추정(ms). 계산할 수 없으면 null.
        basedOnRuns:
          type: integer
          format: int32
          minimum: 1
          description: 추정의 근거가 된 최근 완료 실행 수(최대 20). 적을수록 덜 정확하다.
