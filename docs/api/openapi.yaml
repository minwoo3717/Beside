openapi: 3.0.3
info:
  title: Beside API
  version: 1.2.0
  description: |
    사진 기반 반려동물 3D 재현 서비스의 공개 API 계약 v1. Unity 앱이 보는 유일한 인터페이스이며
    이 파일이 단일 진실 공급원(single source of truth)이다. backend 의 계약 테스트(JobV1ContractTest)가
    springdoc 이 생성한 `/v3/api-docs` 와 이 문서를 비교한다(경로×메서드, operationId, 응답 상태 코드,
    모든 컴포넌트 스키마의 속성 이름(allOf 펼침), 스키마·속성·파라미터의 enum 값, ErrorResponse 구조).

    변경 규칙
    - 응답 필드 "추가"는 PR 설명에 한 줄 기록한 뒤 자유. 클라이언트는 모르는 필드를 무시한다.
    - 기존 필드의 이름/타입 변경·삭제, enum 값 변경, 상태 코드 변경은 주 1회 계약 회의에서만 결정하고
      docs/api/CHANGELOG.md 에 기록, git tag api-v1.x 를 올린다.
    - 모든 enum: 클라이언트는 알 수 없는 값을 받으면 크래시 대신 UNKNOWN 으로 처리한다.
    - 서버 내부 경로(resultPath, 업로드 저장 경로 등)는 어떤 응답에도 노출하지 않는다.

    흐름: POST /api/v1/jobs (202) → GET /api/v1/jobs/{jobId} 를 1~2초 간격으로 폴링 →
    status=COMPLETED 이면 asset.url 로 GLB 다운로드 → status=FAILED 이면 error.code 로 문구 표시,
    필요 시 POST /api/v1/jobs/{jobId}/retry. 기다리는 동안(PENDING) queue·estimate 로 "앞에 N명 · 약 M분" 을
    보여 줄 수 있고, 그만두면 POST /api/v1/jobs/{jobId}/cancel 로 대기열에서 뺀다.

    버전: 1.0.0(api-v1.0) → 1.1.0(api-v1.1, 대기열 상한 503 QUEUE_FULL) → 1.2.0(api-v1.2, 2026-11-21 안건 #11·#12 결정으로
    검토 브랜치 review/api-v1.1 에서 고른 것: 대기 정보 queue·estimate, 대기 취소, 공유 링크(tag share), 반려동물 보관함
    (tag pets), 관리(tag admin), 품질 평가(tag quality), 오류 코드 JOB_NOT_PENDING·JOB_IN_PROGRESS·SHARE_NOT_FOUND·
    PET_NOT_FOUND 와 Job 실패 코드 CANCELED). 모두 추가이고 기존 필드·enum·상태 코드는 그대로다. 검토 브랜치의 작업 삭제
    (DELETE /api/v1/jobs/{jobId})·썸네일·입력 사진 엔드포인트와 JobResponse.thumbnailUrl 은 받지 않았다. 이력은 docs/api/CHANGELOG.md.
    tag share·admin·pets·quality 는 앱이 쓰지 않는 웹용이고, admin·pets·quality 와 공유 링크 만들기·끊기는 배포에서 Caddy
    Basic 인증 뒤다(공유 링크 보기 GET /api/v1/shares/{token}… 만 공개).
    브라우저가 다른 사이트의 페이지에서 보낸 /api/v1 쓰기(POST·PUT·PATCH·DELETE, Sec-Fetch-Site 또는 Origin 으로 판단)는
    400 INVALID_REQUEST 로 거절한다. 앱·도구(이 헤더가 없음)와 이 서버의 웹 페이지(같은 출처)는 해당하지 않는다.

    다음 태그 전 추가(v1.3 후보, 2026-11-26 안건 #24): 제품 이벤트 수집 POST /api/v1/events(tag events, 공개)와
    관리 내보내기 GET /api/v1/admin/events·GET /api/v1/admin/funnel(tag admin). 모두 추가이고 기존 필드·enum·상태 코드는 그대로다.

    다음 태그 전 추가(2026-11-26, 응답 형태 변경 없음): 요청 id 헤더 X-Request-Id. 요청에 넣는 것은 선택이다(1~64자
    A-Z a-z 0-9 . _ : -, 앱은 요청마다 보낸다). backend 는 모든 응답에 그 값을 돌려준다(없거나 규칙 밖이면 새 UUID).
    서버 로그를 이 값으로 찾는다. OpenAPI 3.0 은 모든 응답에 붙는 헤더를 한 번에 적을 수 없어 components/headers/XRequestId
    로 정의하고 작업 접수(202)와 공통 오류 응답(components/responses)에 붙였다. 계약 테스트는 헤더를 비교하지 않는다.
servers:
  - url: http://localhost:8080
    description: 개발 PC 의 로컬 Mock 서버. Android 기기에서는 같은 Wi-Fi 의 PC IP 로 바꾼다.
tags:
  - name: jobs
    description: 3D 생성 작업
  - name: health
    description: 서버 상태
  - name: share
    description: |
      공유 링크와 공개 웹 3D/AR 뷰어. 링크는 `/s/{token}`(웹 페이지, API 가 아님)이고, 페이지는 아래 공개 API 만 부른다.
      토큰은 128비트 난수(base64url 22자)이며 작업 id 는 공유 쪽 응답·오류 어디에도 넣지 않는다.
      링크를 만들고 끊는 것(POST·DELETE /api/v1/jobs/{jobId}/shares, DELETE /api/v1/shares/{token})은 웹 작업 상세 페이지가
      하고 배포에서는 Caddy Basic 인증 뒤다. 앱은 아직 공유하지 않는다(앱 공유는 [계획], 그때 공개 여부를 다시 정한다).
  - name: admin
    description: 운영 대시보드(/admin)와 측정 내보내기. 팀 내부용, 앱은 쓰지 않는다. 배포에서는 Caddy Basic 인증 뒤(/api/v1/admin/*).
  - name: quality
    description: |
      작업 상세 웹 페이지(/job/?id={jobId})가 쓰는 3D 품질 사람 평가(docs/METRICS.md §4 의 6항목, §4.1 저장).
      팀 내부용, 앱은 쓰지 않는다. 배포에서는 Caddy Basic 인증 뒤(/api/v1/jobs/*/ratings*).
      입력 사진을 내주는 엔드포인트(검토 브랜치의 GET /api/v1/jobs/{jobId}/photos/{index})는 v1.2 에 넣지 않았다(2026-11-21 #11).
  - name: pets
    description: |
      반려동물 보관함 웹(/library)용. 펫별로 생성 기록을 모으고, 펫 없이 만든 작업(새 작업은 모두 미분류, petId=null)을 펫에 넣고,
      펫을 지울 때 끝난 작업을 함께 지울 수 있다(withJobs). 팀 내부용이라 앱은 쓰지 않는다. 배포에서는 Caddy Basic 인증 뒤
      (/api/v1/pets*, PUT /api/v1/jobs/{jobId}/pet). 작업 하나 지우기(DELETE /api/v1/jobs/{jobId})와 썸네일
      (GET /api/v1/jobs/{jobId}/thumbnail)은 v1.2 에 넣지 않았다(2026-11-21 #11).
      경로의 리소스가 없으면 404(PET_NOT_FOUND·JOB_NOT_FOUND), 본문이 가리키는 펫이나 작업이 없거나 규칙에 맞지 않으면 400(INVALID_REQUEST)이다.
      보관함에 쓰는 길은 모두 이 인증 뒤 경로다: 공개 POST /api/v1/jobs 는 펫을 정하지 않고(미분류), 보관함 웹은 작업을 만든 뒤
      PUT /api/v1/jobs/{jobId}/pet 을 부른다. JobResponse.petId 는 공개 GET /api/v1/jobs/{jobId} 에도 나오지만 그 UUID 로
      할 수 있는 일은 모두 인증 뒤다.
  - name: events
    description: |
      제품 이벤트(클릭·노출·퍼널) 수집, 2026-11-26 안건 #24. 앱(Unity)과 공유 뷰어(/s/{token})가 화면 보기·버튼 누름을 묶음으로 보낸다.
      공개(Caddy 인증 없음)이고 POST 만 받는다. 이름·속성은 정해진 목록(enum·작은 정수)만 저장하고 모르는 것은 버리고 센다.
      IP·파일 이름·서버 주소·공유 토큰·자유 글은 받지 않는다(docs/METRICS.md §6). 읽기는 관리 API(tag admin)만, 보존 30일.

paths:
  /api/v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: 사진을 업로드해 3D 생성 작업을 만든다
      description: |
        multipart/form-data 의 `photos` 파트로 사진 1~10장을 보낸다. 장당 5 MB 이하, 요청 전체 20 MB 이하
        (2026-11-21 확정). Content-Type 은 image/jpeg · image/png · image/webp 만 허용한다.
        접수 즉시 202 를 돌려주고 처리는 비동기로 진행된다. `Idempotency-Key` 헤더를 보내면 같은 키의 재요청에
        같은 jobId 를 돌려준다(서버 DB 에 저장되어 재시작 후에도 유지).

        프로파일에 따라 검사가 다르다. 그래서 같은 요청이 mock 에서는 202, 공개 서버(real,prod)에서는 400 일 수 있다.

        | 검사 | mock | real | prod (공개 서버는 real,prod) |
        |---|---|---|---|
        | 파트에 선언된 Content-Type | 함 | 함 | 함 |
        | 파일 시그니처(사진마다 앞 바이트) | 안 함 | 안 함 | 함 |
        | 대표 사진 검사(첫 장) | 안 함 | 함 | 함 (real 에서 물려받음) |

        - 선언된 Content-Type 이 셋 중 하나가 아니면 400 `UNSUPPORTED_IMAGE_TYPE`. mock·real 은 이것만 보고 파일 내용은 보지 않는다.
        - 파일 시그니처(서버 설정 `upload.verify-magic`, prod 만 켬): 모든 사진이 JPEG(`FF D8 FF`)·PNG(`89 50 4E 47 0D 0A 1A 0A`)·
          WEBP(`RIFF` … `WEBP`) 시그니처로 시작해야 한다. 아니면 400 `UNSUPPORTED_IMAGE_TYPE`. 셋 중 어느 것이든 통과하며
          선언된 Content-Type 과 같은 형식인지는 보지 않는다.
        - 대표 사진 검사(서버 설정 `preprocess.check.enabled`): 첫 장(대표 사진)을 접수 전에 검사한다 —
          이미지로 읽히는지, 해상도, 개·고양이가 정확히 한 마리인지, 동물 크기, 밝기, 선명도. 처음 걸린 이유 하나로
          400 을 돌려주고(코드 7개는 ERROR_CODES.md 의 '대표 사진 검사'), 거절된 요청은 아무것도 남기지 않는다.
          검사 기준값은 제안값이다(장수·용량 상한과 달리 아직 확정하지 않음).
        - 검사 순서: 용량(413) → 개수 → 사진마다 (빈 파일 → Content-Type → 시그니처) → `Idempotency-Key` 길이 →
          같은 키의 재요청이면 그 작업(202) → 대기열 상한(켠 경우 503, 아래) → 대표 사진 검사. 그래서 시그니처가
          없는 첫 장은 prod 에서 `UNSUPPORTED_IMAGE_TYPE`, real 에서는 대표 사진 검사의 `UNREADABLE_IMAGE` 다.

        대기열 상한(2026-11-21 안건 #21 결정, api-v1.1): 서버 설정 `admission.max-pending` 으로 켠 경우(기본 꺼짐)
        PENDING 작업과 지금 접수 중인 요청을 더한 수가 서버 상한에 이르면 작업을 만들지 않고 503(QUEUE_FULL)과
        `Retry-After`(초)로 거절한다(`admission.stale-after-ms` 보다 오래된 PENDING 은 세지 않는다,
        ERROR_CODES.md '대기열 상한'). 거절된 요청은 사진·작업·`Idempotency-Key` 를 남기지 않는다.
        상한은 대표 사진 검사보다 먼저라, 상한이 차 있으면 사진 문제(400)보다 503 을 먼저 받는다.
        같은 키의 요청은 상한과 상관없이 그 키의 작업을 202 로 돌려준다. 같은 키의 요청이 아직 접수 중이면
        함께 접수해 작업은 많아야 하나만 생긴다.

        이 공개 요청은 보관함(tag pets)의 펫을 정하지 않는다: 만든 작업은 미분류(petId=null)이고, 보관함 웹은 202 뒤에
        인증 뒤의 PUT /api/v1/jobs/{jobId}/pet 으로 펫에 넣는다(검토 브랜치의 multipart 파트 petId 는 공개 경로로 보관함에
        쓰게 되어 v1.2 에 넣지 않았다).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: 반려동물 사진. 1~10장, 장당 ≤ 5 MB, 요청 전체 ≤ 20 MB, image/jpeg | image/png | image/webp.
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: 작업 접수. Location 헤더와 본문의 jobId 로 상태를 폴링한다.
          headers:
            Location:
              description: 생성된 작업의 조회 경로. 서버 루트 기준 상대 경로 `/api/v1/jobs/{jobId}`.
              schema:
                type: string
                example: /api/v1/jobs/3fa85f64-5717-4562-b3fc-2c963f66afa6
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreatedResponse'
        '400':
          $ref: '#/components/responses/CreateJobBadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/QueueFull'
    get:
      tags: [jobs]
      operationId: listJobs
      summary: 작업 목록 (개발·디버그용)
      description: |
        최근 작업부터 돌려준다. 앱의 정상 흐름에서는 쓰지 않으며 개발·디버그·데모 정리용이다.
        `nextCursor` 가 null 이 아니면 그 값을 `cursor` 로 넘겨 다음 페이지를 받는다. cursor 는 불투명 문자열이다.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 작업 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{jobId}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: 작업 상태 조회 (폴링)
      description: 1~2초 간격으로 폴링한다. status 가 COMPLETED 또는 FAILED 가 되면 폴링을 멈춘다.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/jobs/{jobId}/asset:
    get:
      tags: [jobs]
      operationId: downloadAsset
      summary: 생성된 GLB 다운로드
      description: |
        status=COMPLETED 인 작업의 GLB 파일을 돌려준다. 파일 계약은 docs/asset/GLB_SPEC.md.
        `variant` 는 base 하나뿐이고 생략하면 base 다. 그 밖의 값은 작업을 찾기 전에 400 `INVALID_REQUEST` 로 거절한다 —
        2026-11-21 에 계약에서 뺀 `hair` 도 마찬가지이고, 작업의 상태나 존재 여부와 상관없이 400 이다(jobId 없음).
        작업은 완료됐지만 GLB 파일이 서버에 없으면 404 `ASSET_NOT_FOUND`, 작업이 아직 완료되지 않았거나 실패했으면
        409 `JOB_NOT_COMPLETED` 를 돌려준다.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Variant'
      responses:
        '200':
          description: GLB 바이너리
          headers:
            Content-Disposition:
              description: attachment; filename="{jobId}-{variant}.glb"
              schema:
                type: string
            Content-Length:
              description: 파일 크기(바이트). JobResponse.asset.bytes 와 같다.
              schema:
                type: integer
                format: int64
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{jobId}/retry:
    post:
      tags: [jobs]
      operationId: retryJob
      summary: 실패한 작업을 같은 사진으로 다시 실행한다
      description: |
        status=FAILED 인 작업만 재시도할 수 있다. 성공하면 202 와 함께 같은 jobId 를 돌려주고 작업은 PENDING 으로 돌아간다.
        error 는 비워지고 timings 는 재시도 시점부터 다시 측정한다. FAILED 가 아닌 작업은 409(JOB_NOT_FAILED).

        대기열 상한(2026-11-21 안건 #21 결정, api-v1.1): 상한을 켠 경우(기본 꺼짐) 404·409 를 먼저 보고,
        PENDING 작업과 지금 접수 중인 요청을 더한 수가 서버 상한에 이르면 작업을 FAILED 그대로 두고
        503(QUEUE_FULL)과 `Retry-After`(초)로 거절한다. 이때 error.jobId 는 그 작업이다.
        같은 작업의 retry 가 동시에 들어오면 202 는 많아야 하나다. 자리가 있으면 나머지는 409(JOB_NOT_FAILED),
        대기열이 차 있으면 모두 503(QUEUE_FULL)이다.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: 재시도 접수
          headers:
            Location:
              description: 작업 조회 경로 `/api/v1/jobs/{jobId}`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreatedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/QueueFull'

  /api/v1/healthz:
    get:
      tags: [health]
      operationId: health
      summary: 서버 상태와 활성 프로파일
      description: 앱이 서버 주소 설정을 확인할 때 쓴다. 인증 없음.
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/jobs/{jobId}/shares:
    post:
      tags: [share]
      operationId: createShare
      summary: 완료된 작업의 공유 링크를 만든다
      description: |
        status=COMPLETED 이고 base GLB 가 있는 작업만 공유할 수 있다. 부를 때마다 새 토큰을 만든다(이전 링크는 그대로).
        `url` 은 앱 설치 없이 여는 웹 뷰어 페이지 `/s/{token}` 이고, 서버 루트 기준 상대 경로라 클라이언트가 baseUrl 과 결합한다.
        유효 기간은 `ttlDays`(1~30일, 생략 시 서버 설정 `share.ttl-days`, 기본 7)이다. 범위 밖이면 400(INVALID_REQUEST),
        없는 작업은 404(JOB_NOT_FOUND), 완료되지 않은 작업은 409(JOB_NOT_COMPLETED), 완료됐지만 파일이 없으면 404(ASSET_NOT_FOUND).
        작업 하나의 살아 있는(만료·취소 전) 링크는 20개까지다. 20개가 있으면 400(INVALID_REQUEST)이고, 먼저 revokeJobShares 로
        끊는다. 웹 작업 상세 페이지(/job/?id=)가 부르며 앱은 쓰지 않는다. 배포에서는 Caddy Basic 인증 뒤(/api/v1/jobs/*/shares*).
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/TtlDays'
      responses:
        '201':
          description: 공유 링크 생성
          headers:
            Location:
              description: 공유 정보 조회 경로 `/api/v1/shares/{token}`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [share]
      operationId: revokeJobShares
      summary: 작업의 살아 있는 공유 링크를 모두 끊는다
      description: |
        토큰을 몰라도 링크를 끊는 길이다(토큰은 만들 때 한 번만 응답하고 서버 로그에는 앞 6자만 남는다). 끊은 링크는
        정보·에셋 모두 404(SHARE_NOT_FOUND). `revoked` 는 이번에 끊은 수이고 끊을 것이 없으면 0 이다(작업 상태와 상관없음).
        없는 작업은 404(JOB_NOT_FOUND). 웹 작업 상세 페이지의 '공유 링크 모두 끊기' 버튼이 부른다. 배포에서는 Caddy Basic 인증 뒤.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 끊음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharesRevokedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/shares/{token}:
    get:
      tags: [share]
      operationId: getShare
      summary: 공유 링크 정보 (공개 뷰어용)
      description: |
        뷰어 페이지가 처음 부른다. 만료 시각과 GLB 주소를 돌려준다. 작업 id 는 넣지 않는다.
        없는 토큰·만료된 링크·취소된 링크·지워진 작업은 모두 같은 404(SHARE_NOT_FOUND)다(이유를 구분하지 않는다).
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: 공유 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareInfo'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [share]
      operationId: revokeShare
      summary: 공유 링크를 취소한다
      description: 취소 후에는 정보·에셋 모두 404(SHARE_NOT_FOUND). 이미 취소됐거나 만료된 링크도 404.
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '204':
          description: 취소됨
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/shares/{token}/asset:
    get:
      tags: [share]
      operationId: downloadShareAsset
      summary: 공유된 GLB (공개 뷰어·AR 용)
      description: |
        공유된 작업의 base GLB. 브라우저 뷰어와 Android Scene Viewer 가 인증 없이 직접 받는다.
        `Cache-Control: public, max-age=N` 으로 N 은 3600 과 만료까지 남은 초 중 작은 값이다(취소해도 이미 받은 사본은 그 시간 동안 남을 수 있다).
        파일명에 작업 id 를 넣지 않는다.
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: GLB 바이너리
          headers:
            Cache-Control:
              description: public, max-age=N (N ≤ 3600, 만료까지 남은 초 이하)
              schema:
                type: string
            Content-Disposition:
              description: inline; filename="beside-pet.glb"
              schema:
                type: string
            Content-Length:
              description: 파일 크기(바이트). ShareInfo.asset.bytes 와 같다.
              schema:
                type: integer
                format: int64
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ShareNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      summary: 운영 현황 — 상태별 작업 수, 대기열, 디스크, GPU
      description: |
        관리 대시보드(/admin)가 5초마다 부른다. Spring 에는 인증 코드가 없고 배포에서는 Caddy Basic 인증이 막는다.
        `inference` 는 real 프로파일에서 GPU 추론 서비스 감시(15초마다 /healthz)의 마지막 값이고, mock 에서는 null 이다.
      responses:
        '200':
          description: 현황
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/runs:
    get:
      tags: [admin]
      operationId: adminRuns
      summary: 실행별 측정표(job_runs) 내보내기 — JSON 또는 CSV
      description: |
        docs/METRICS.md §1.1 의 측정표. 열 이름과 순서는 METRICS §1.1 그대로다:
        jobId, attempt, finishedAt, workerType, status, errorCode, uploadBytes, uploadMs, queuedMs, processingMs, totalMs,
        inferMs, gpuPeakMB, modelParams, outputVertices, outputTriangles, convertMs, glbBytes, passthrough, modelVersion.

        - `format=json`(기본): 위 이름·순서의 AdminRun 객체 배열.
        - `format=csv`: 헤더 행 + 실행마다 한 행. RFC 4180 — 쉼표·큰따옴표·줄바꿈이 든 값은 큰따옴표로 감싸고 안의 큰따옴표는
          두 번 쓴다. null 은 빈 칸, finishedAt 은 ISO 8601 UTC, passthrough 는 true | false, 줄 끝은 CRLF.
          `Content-Type: text/csv; charset=UTF-8`, `Content-Disposition: attachment; filename="job_runs.csv"`.

        finishedAt 오름차순(같으면 jobId·attempt 순). 기본으로 패스스루(`passthrough=true`) 행을 뺀다. FAILED 행은 들어 있다
        (측정표에서는 status 열로 거른다). 서버 경로는 없다. 잘못된 format·from·to·includePassthrough 는 400 INVALID_REQUEST.
      parameters:
        - name: format
          in: query
          required: false
          description: 응답 형식. 대소문자 무시.
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: from
          in: query
          required: false
          description: finishedAt 하한(포함). ISO 8601 instant, 예 `2026-11-06T00:00:00Z`. 생략하면 처음부터.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: finishedAt 상한(제외). ISO 8601 instant. 생략하면 끝까지. from 보다 앞이면 400.
          schema:
            type: string
            format: date-time
        - name: modelVersion
          in: query
          required: false
          description: 이 modelVersion 의 행만. `(none)` 이면 modelVersion 이 null 인 행만(stats 의 묶음 이름과 같다).
          schema:
            type: string
        - name: includePassthrough
          in: query
          required: false
          description: true 면 패스스루 행도 넣는다. 기본 false — 모델이 돌지 않은 실행은 측정이 아니다(METRICS §1).
          schema:
            type: boolean
            default: false
        - name: workerType
          in: query
          required: false
          description: 이 워커 종류의 행만 (mock | real). 생략하면 전부.
          schema:
            type: string
      responses:
        '200':
          description: 실행 행. format 에 따라 JSON 배열 또는 CSV.
          headers:
            Content-Disposition:
              description: format=csv 일 때만 `attachment; filename="job_runs.csv"`
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRun'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/stats:
    get:
      tags: [admin]
      operationId: adminStats
      summary: modelVersion × workerType 별 성공률과 시간 백분위
      description: |
        adminRuns 와 같은 행(from·to·includePassthrough 로 거른 job_runs)을 modelVersion(null 은 `(none)`) × workerType 으로 묶는다.
        runs·completed·failed 는 사용자가 취소한 실행(FAILED + error.code CANCELED)을 뺀 행을 센다 — 취소는 canceled 에 따로.
        successRate = completed / runs (runs 가 0 이면 0).
        백분위와 평균은 그 묶음의 **COMPLETED 행 중 값이 있는 행만** 쓴다 — 실패 실행은 시간 분포를 흐리므로 METRICS §1.1 의
        제외 규칙대로 뺀다. 백분위는 nearest-rank 방식이다: 값을 오름차순으로 놓고 ceil(p/100 × n) 번째 값(1부터 센다).
        보간하지 않으므로 항상 실제 측정값 중 하나다. 예 n=20 이면 p50 = 10번째, p95 = 19번째. n=0 이면 p50·p95·평균은 null.
        묶음 순서는 modelVersion, workerType 오름차순.
      parameters:
        - name: from
          in: query
          required: false
          description: finishedAt 하한(포함). ISO 8601 instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: finishedAt 상한(제외). ISO 8601 instant. from 보다 앞이면 400.
          schema:
            type: string
            format: date-time
        - name: includePassthrough
          in: query
          required: false
          description: true 면 패스스루 행도 센다. 기본 false.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 묶음별 통계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/jobs:
    get:
      tags: [admin]
      operationId: adminJobs
      summary: 최근 작업 요약 (대시보드 표)
      description: |
        createdAt 최신순. 기존 `GET /api/v1/jobs` 와 달리 사진 목록 대신 실패 코드·시도 횟수·마지막 실행의 modelVersion 을 준다.
        잘못된 limit 은 400 INVALID_REQUEST.
      parameters:
        - name: limit
          in: query
          required: false
          description: 1~100, 기본 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 최근 작업
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{jobId}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: 대기 중(PENDING)인 작업을 취소한다
      description: |
        status=PENDING 인 작업만 취소할 수 있다. 성공하면 200 과 함께 바뀐 작업을 돌려준다: status=FAILED,
        error.code=CANCELED. 작업은 GPU 대기열에서 빠지고 워커는 그 작업을 시작하지 않는다(추론 서비스를 부르지 않는다).
        취소한 작업도 retry 로 처음부터 다시 실행할 수 있다(맨 뒤에 다시 줄 선다).
        PROCESSING 은 이미 시작한 GPU 연산을 멈출 수 없어 취소하지 않는다. PENDING 이 아닌 작업(이미 취소한 작업 포함)은
        409(JOB_NOT_PENDING) 이므로, 앱은 409 를 받으면 GET 으로 현재 상태를 다시 읽는다.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 취소됨. status=FAILED, error.code=CANCELED 인 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{jobId}/ratings:
    get:
      tags: [quality]
      operationId: listJobRatings
      summary: 작업의 품질 평가 목록과 항목별 평균
      description: |
        docs/METRICS.md §4 의 사람 평가 6항목(각 1~5). `items` 는 평가자 이름 오름차순, `average` 는 6항목 각각의 산술 평균(소수)과
        평가자 수다. 평가가 없으면 `items` 는 빈 배열, `average` 는 null. 없는 작업은 404(JOB_NOT_FOUND).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 평가 목록과 평균
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRatingList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{jobId}/ratings/{rater}:
    put:
      tags: [quality]
      operationId: putJobRating
      summary: 평가자 한 명의 품질 평가를 저장한다 (같은 평가자는 덮어쓰기)
      description: |
        COMPLETED 작업만 평가할 수 있다(아니면 409 JOB_NOT_COMPLETED). 같은 작업·같은 평가자(앞뒤 공백을 뺀 이름, 대소문자 구분)로
        다시 보내면 6항목과 comment 를 모두 새 값으로 바꾸고 updatedAt 을 갱신한다(createdAt 은 그대로).
        6항목은 모두 필수이며 1~5 정수(3.0·"3" 같은 표기는 받지 않는다). comment 는 선택, 앞뒤 공백을 뺀 뒤 500자 이하이며 빈 문자열은 null 로 저장한다.
        검사 순서: 평가자 이름·본문(400 INVALID_REQUEST, JSON 이 아닌 본문 포함) → 작업(404 JOB_NOT_FOUND) → 상태(409).
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Rater'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRatingRequest'
      responses:
        '200':
          description: 저장된 평가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRating'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/ratings:
    get:
      tags: [admin]
      operationId: adminRatings
      summary: 품질 평가 측정표 — JSON 또는 CSV
      description: |
        평가 한 건이 한 행이다. 그 작업의 마지막 실행(job_runs 에서 attempt 가 가장 큰 행)의 modelVersion·workerType·passthrough 를
        붙인다(실행 행이 없으면 null). 열 이름과 순서(CSV 헤더 = JSON 이름, docs/METRICS.md §4.1):
        jobId, modelVersion, rater, faceShape, ears, bodyProportion, furColor, pattern, textureArtifacts, comment, updatedAt,
        workerType, passthrough.

        CSV 형식은 adminRuns 와 같다(RFC 4180, null 은 빈 칸, 줄 끝 CRLF, `Content-Type: text/csv; charset=UTF-8`),
        파일명은 `Content-Disposition: attachment; filename="job_ratings.csv"`. updatedAt 오름차순(같으면 jobId·rater 순).
        기본으로 패스스루 실행(passthrough=true)의 평가를 뺀다 — 모델이 돌지 않은 결과의 품질은 측정이 아니다.
        잘못된 format·from·to·includePassthrough 는 400 INVALID_REQUEST.
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
        - name: from
          in: query
          required: false
          description: updatedAt 하한(포함). ISO 8601 instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: updatedAt 상한(제외). ISO 8601 instant. from 보다 앞이면 400.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/IncludePassthrough'
      responses:
        '200':
          description: 평가 행. format 에 따라 JSON 배열 또는 CSV.
          headers:
            Content-Disposition:
              description: format=csv 일 때만 `attachment; filename="job_ratings.csv"`
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRating'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/ratings/summary:
    get:
      tags: [admin]
      operationId: adminRatingSummary
      summary: modelVersion 별 품질 평가 평균 (보고서의 베이스라인 vs 개선안 표)
      description: |
        adminRatings 와 같은 행(from·to·includePassthrough 로 거른 평가)을 modelVersion(null 은 `(none)`, adminStats 와 같은 이름)으로 묶는다.
        6항목 평균은 그 묶음의 **평가 행 전체의 산술 평균**이다(작업별 평균의 평균이 아님). ratings = 평가 행 수, raters = 서로 다른
        평가자 수, jobs = 서로 다른 작업 수. 묶음 순서는 modelVersion 오름차순.
      parameters:
        - name: from
          in: query
          required: false
          description: updatedAt 하한(포함). ISO 8601 instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: updatedAt 상한(제외). ISO 8601 instant. from 보다 앞이면 400.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/IncludePassthrough'
      responses:
        '200':
          description: modelVersion 별 평균
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRatingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/client-metrics:
    get:
      tags: [admin]
      operationId: adminClientMetrics
      summary: 가져온 앱 측정(metrics.csv 행) — JSON 또는 CSV
      description: |
        importClientMetrics 로 가져온 행을 가져온 순서대로 돌려준다. 열 이름과 순서는 docs/METRICS.md §3 의 앱 `metrics.csv` 헤더 그대로다:
        jobId, uploadMs, waitMs, downloadMs, loadMs, e2eMs, avgFps, minFps, memMB, device. 그래서 CSV(`client_metrics.csv`)는
        다시 가져올 수 있다(모든 행이 중복으로 건너뛰어진다). CSV 형식은 adminRuns 와 같다.
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: 앱 측정 행. format 에 따라 JSON 배열 또는 CSV.
          headers:
            Content-Disposition:
              description: format=csv 일 때만 `attachment; filename="client_metrics.csv"`
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminClientMetric'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      operationId: importClientMetrics
      summary: 앱이 폰에 쓴 metrics.csv 를 올려 서버에 저장한다
      description: |
        팀원이 `adb pull` 로 받은 `metrics.csv`(docs/METRICS.md §3)를 관리 페이지에서 올린다. 앱 변경은 필요 없다.
        multipart 파트 `file` 하나. UTF-8(BOM 허용), RFC 4180(따옴표로 감싼 칸, 줄 끝 LF 또는 CRLF).
        첫 줄은 METRICS §3 헤더와 **정확히** 같아야 한다(`jobId,uploadMs,waitMs,downloadMs,loadMs,e2eMs,avgFps,minFps,memMB,device`).
        아니면, 또는 파트가 없거나 비어 있으면 아무것도 저장하지 않고 400 INVALID_REQUEST.

        데이터 줄 검사(실패한 줄만 errors 에 넣고 나머지는 저장): 칸 10개, jobId 1~64자, uploadMs·waitMs·downloadMs·loadMs·e2eMs·memMB 는
        0 이상 정수, avgFps·minFps 는 0 이상 소수(`.` 소수점), device 는 빈 칸 허용(256자 이하). 빈 줄은 무시한다.
        (jobId, device, e2eMs) 가 이미 저장된 행이나 같은 파일의 앞 줄과 같으면 중복으로 보고 건너뛴다(skipped).
        jobId 가 이 서버에 없는 작업이어도 저장한다(e2e 결합에서 서버 열이 비게 된다).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 앱의 metrics.csv (≤ 5 MB)
      responses:
        '200':
          description: 가져오기 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClientMetricImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/e2e:
    get:
      tags: [admin]
      operationId: adminE2e
      summary: 서버·추론·앱 측정을 jobId 로 합친 표 — JSON 또는 CSV
      description: |
        앱 측정 한 행(adminClientMetrics)마다 한 행이다. 그 jobId 의 마지막 COMPLETED 실행(job_runs, attempt 가 가장 큰 COMPLETED 행)의
        서버·추론 열을 붙인다. 실행이 없으면(다른 서버의 작업, 실패한 작업) 서버·추론 열은 null 이다.
        열 이름은 docs/METRICS.md 의 이름 그대로이고, 서버와 앱에 같은 이름이 있는 `uploadMs` 만 서버 것을 `serverUploadMs` 로 쓴다
        (METRICS §3.1). 순서(CSV 헤더 = JSON 이름):
        jobId, modelVersion, workerType, passthrough, attempt, finishedAt, uploadBytes, serverUploadMs, queuedMs, processingMs, totalMs,
        inferMs, gpuPeakMB, modelParams, outputVertices, outputTriangles, convertMs, glbBytes,
        uploadMs, waitMs, downloadMs, loadMs, e2eMs, avgFps, minFps, memMB, device.
        CSV 는 `e2e.csv`, 형식은 adminRuns 와 같다. 가져온 순서대로. 기본으로 패스스루 실행의 행을 뺀다.
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
        - $ref: '#/components/parameters/IncludePassthrough'
      responses:
        '200':
          description: 결합 행. format 에 따라 JSON 배열 또는 CSV.
          headers:
            Content-Disposition:
              description: format=csv 일 때만 `attachment; filename="e2e.csv"`
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminE2eRow'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/jobs/{jobId}:
    get:
      tags: [admin]
      operationId: adminJob
      summary: 작업 하나의 요약 (작업 상세 페이지의 시도 횟수·modelVersion)
      description: |
        adminJobs 의 한 줄과 같은 값(AdminJobSummary)을 작업 하나에 대해 돌려준다. 작업 상세 페이지(/job/?id=)가 JobResponse 에 없는
        시도 횟수와 마지막 실행의 modelVersion 을 보여 줄 때 쓴다. 없는 작업은 404(JOB_NOT_FOUND).
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 작업 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/pets:
    post:
      tags: [pets]
      operationId: createPet
      summary: 보관함에 반려동물을 추가한다
      description: |
        name 은 앞뒤 공백을 뺀 1~40자, species 는 DOG | CAT | OTHER(생략하면 DOG), note 는 500자 이하(생략·빈 값은 null).
        규칙에 맞지 않거나 본문이 JSON 이 아니면 400 INVALID_REQUEST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: 추가됨
          headers:
            Location:
              description: 펫 조회 경로 `/api/v1/pets/{petId}`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [pets]
      operationId: listPets
      summary: 보관함의 반려동물 목록
      description: 추가한 순서(createdAt 오름차순). 작업 수·대표 모델·마지막 작업 시각을 함께 준다. 페이지는 없다(팀 내부 규모).
      responses:
        '200':
          description: 반려동물 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/pets/{petId}:
    get:
      tags: [pets]
      operationId: getPet
      summary: 반려동물 한 마리와 생성 기록
      description: PetResponse 의 필드에 이 펫의 작업(createdAt 최신순 JobResponse)과 작업별 modelVersion 을 더해 돌려준다.
      parameters:
        - $ref: '#/components/parameters/PetId'
      responses:
        '200':
          description: 반려동물과 생성 기록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [pets]
      operationId: updatePet
      summary: 이름·종·메모·대표 모델을 바꾼다
      description: |
        JSON merge patch 처럼 보낸 필드만 바꾼다. name·species 는 null 로 보낼 수 없고, note·coverJobId 는 null 로 지운다
        (coverJobId=null 이면 대표는 자동: 이 펫의 가장 최근 COMPLETED 작업). coverJobId 는 이 펫에 들어 있는 COMPLETED 작업만
        고를 수 있다(아니면 400 INVALID_REQUEST). 모르는 필드는 무시한다.
      parameters:
        - $ref: '#/components/parameters/PetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePetRequest'
      responses:
        '200':
          description: 바뀐 반려동물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [pets]
      operationId: deletePet
      summary: 반려동물을 보관함에서 지운다
      description: |
        기본(withJobs=false)은 이 펫의 작업을 지우지 않고 미분류(petId=null)로 되돌린다.
        withJobs=true 면 작업도 지운다: 업로드 사진과 결과 GLB 폴더(storage.result.dir/{jobId})를 지우고, 활성 공유 링크를
        모두 취소하고(이후 SHARE_NOT_FOUND), 그 작업을 가리키는 Idempotency-Key 를 지운다(같은 키로 다시 올리면 새 작업).
        실행 측정(job_runs·events.jsonl)과 품질 평가(job_ratings)·앱 측정(client_metrics)은 측정 기록이라 남긴다.
        이때 PENDING·PROCESSING 작업이 하나라도 있으면 아무것도 지우지 않고 409(JOB_IN_PROGRESS, error.jobId = 그 작업)다
        — 대기 중이면 cancel 한 뒤, 생성 중이면 끝난 뒤 지운다. 잘못된 withJobs 값은 400 INVALID_REQUEST.
      parameters:
        - $ref: '#/components/parameters/PetId'
        - $ref: '#/components/parameters/WithJobs'
      responses:
        '204':
          description: 지움
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/jobs/{jobId}/pet:
    put:
      tags: [pets]
      operationId: setJobPet
      summary: 작업을 반려동물에 넣거나 미분류로 뺀다
      description: |
        본문 `{ "petId": "<uuid>" }` 이면 그 펫에 넣고 `{ "petId": null }` 이면 미분류로 뺀다. 상태와 관계없이(생성 중에도) 바꿀 수 있다.
        petId 필드가 없거나 없는 펫이면 400 INVALID_REQUEST, 없는 작업은 404 JOB_NOT_FOUND. 펫에서 빼면 그 펫이 이 작업을
        대표로 골라 두었던 것도 지운다(대표는 자동으로 돌아간다).
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPetRequest'
      responses:
        '200':
          description: 바뀐 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/events:
    post:
      tags: [events]
      operationId: recordEvents
      summary: 제품 이벤트 묶음을 보낸다 (앱·공유 뷰어, 공개)
      description: |
        2026-11-26 안건 #24, 다음 태그 전 추가(v1.3 후보). 앱(platform android)과 공유 뷰어(platform web)가 화면 보기·버튼 누름을
        1~50개씩 묶어 보낸다. 본문은 JSON(ProductEventBatch) 32 KB(32,768 바이트) 이하. 이벤트 이름·속성은 docs/METRICS.md §6 의 표가 기준이다.

        - 묶음 검사(실패하면 아무것도 저장하지 않음): 본문이 32 KB 를 넘으면 413 PAYLOAD_TOO_LARGE. JSON 이 아니거나, installId·sessionId 가
          UUID 가 아니거나, appVersion 이 `[0-9A-Za-z._+-]` 1~32자가 아니거나, platform 이 android | web 이 아니거나, events 가 1~50개
          배열이 아니면 400 INVALID_REQUEST.
        - 이벤트 검사(실패한 이벤트만 버리고 dropped 로 센다, 400 이 아님): 모르는 name, at 이 ISO 8601 시각이 아님, seq 가 0 이상 정수가
          아님, screen_view 인데 screen 이 없음, 같은 sessionId·seq 가 이미 저장됨(앱이 응답을 못 받고 다시 보낸 경우).
        - 속성 검사(그 값만 버리고 이벤트는 저장): props 에서 그 이벤트의 표에 없는 키·범위 밖 값, 형식이 다른 jobId, 목록에 없는 screen.
          표에 없는 이벤트 필드와 묶음 필드(IP·주소·토큰·파일 이름 같은 것)는 읽지 않고 저장하지 않는다.
        - 서버 전체 요청 수 상한(토큰 버킷, 초당 50 묶음, 순간 100 묶음)을 넘으면 저장하지 않고 202 로 accepted 0, dropped = 이벤트 수를
          돌려준다(새 상태 코드를 만들지 않으려고 — 429 RATE_LIMITED 는 #22 의 예약 그대로). 클라이언트는 2xx 를 받으면 그 묶음을 지운다.
        - 서버가 붙이는 값: 받은 시각 receivedAt, 지표 환경 env(local | prod | loadtest). 보존 30일(#23 자동 삭제 전까지 손으로 지운다).
        브라우저가 다른 사이트의 페이지에서 보낸 요청은 다른 /api/v1 쓰기처럼 400 INVALID_REQUEST 다(같은 출처의 공유 뷰어는 해당 없음).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEventBatch'
      responses:
        '202':
          description: 받음. accepted 는 저장한 이벤트 수, dropped 는 버린 이벤트 수(속성만 버린 이벤트는 accepted 에 들어간다).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEventsAccepted'
        '400':
          $ref: '#/components/responses/EventsBadRequest'
        '413':
          $ref: '#/components/responses/EventsTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/events:
    get:
      tags: [admin]
      operationId: adminEvents
      summary: 제품 이벤트 내보내기 — JSON 또는 CSV
      description: |
        recordEvents 로 저장한 이벤트 한 건이 한 행이다(docs/METRICS.md §6). 열 이름과 순서(CSV 헤더 = JSON 이름):
        receivedAt, env, platform, appVersion, installId, sessionId, seq, at, name, screen, jobId, props.
        props 는 JSON 에서는 객체, CSV 에서는 그 객체의 JSON 글(속성이 없으면 빈 칸)이다.
        CSV 형식은 adminRuns 와 같다(RFC 4180, null 은 빈 칸, 줄 끝 CRLF), 파일명 `product_events.csv`.
        receivedAt 오름차순(같으면 저장 순서). from·to 는 receivedAt(서버가 받은 시각) 기준이다. 잘못된 format·from·to 는 400 INVALID_REQUEST.
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
        - name: from
          in: query
          required: false
          description: receivedAt 하한(포함). ISO 8601 instant. 생략하면 처음부터.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: receivedAt 상한(제외). ISO 8601 instant. 생략하면 끝까지. from 보다 앞이면 400.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 이벤트 행. format 에 따라 JSON 배열 또는 CSV.
          headers:
            Content-Disposition:
              description: format=csv 일 때만 `attachment; filename="product_events.csv"`
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProductEvent'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/funnel:
    get:
      tags: [admin]
      operationId: adminFunnel
      summary: 세션 퍼널 — 단계별 세션 수·전환율·단계 사이 시간
      description: |
        receivedAt 이 [from, to) 인 이벤트를 sessionId 로 묶어 새로 만들기 흐름의 여섯 단계를 센다(docs/METRICS.md §6.2):
        home(screen_view screen=home) → photos_selected(count 가 0 이 아닌 것) → generate_tap → model_ready →
        ar(screen_view screen=ar) → model_placed.
        세션마다 각 단계의 시각은 앞 단계 시각 이후(같은 세션 안에서 at, 같으면 seq 순)에 처음 나온 그 이벤트의 at 이고, 앞 단계에
        이르지 못한 세션은 뒤 단계에도 세지 않는다. sessions = 그 단계에 이른 서로 다른 세션 수, conversionPct = 첫 단계 대비 %,
        fromPrevPct = 바로 앞 단계 대비 %(첫 단계 null), medianSecondsFromPrev = 앞 단계에서 이 단계까지 걸린 초의 중앙값
        (nearest-rank, adminStats 와 같은 방식, 첫 단계·세션 0 이면 null). 분모가 0 이면 % 는 0.
        이어보기(generate_tap mode=resume)처럼 앞 단계를 건너뛴 세션은 그 뒤 단계에 세지 않는다. 잘못된 from·to 는 400 INVALID_REQUEST.
      parameters:
        - name: from
          in: query
          required: false
          description: receivedAt 하한(포함). ISO 8601 instant.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: receivedAt 상한(제외). ISO 8601 instant. from 보다 앞이면 400.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 단계별 퍼널
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFunnel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  headers:
    XRequestId:
      description: >-
        이 요청의 id. 요청의 X-Request-Id 가 1~64자의 A-Z a-z 0-9 . _ : - 이면 그 값, 없거나 규칙 밖이면 서버가 만든 UUID 다.
        backend(Spring)가 쓰는 모든 응답에 붙는다(오류·v0·웹 페이지 포함. Caddy 가 직접 답하는 응답에는 없다). 서버 로그는
        이 값으로 찾는다(텍스트 로그 rid=, prod JSON 로그 필드 requestId). 2026-11-26 추가, 응답 형태 변경 없음.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,64}$'
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: 작업 ID (UUID)
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 선택. 1~128자. 같은 키로 다시 보내면 새 작업을 만들지 않고 같은 jobId 를 202 로 돌려준다.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Variant:
      name: variant
      in: query
      required: false
      description: 에셋 종류. base 뿐이고 생략 시 base. 그 밖의 값(2026-11-21 에 뺀 hair 포함)은 400 INVALID_REQUEST.
      schema:
        type: string
        enum: [base]
        default: base
    Limit:
      name: limit
      in: query
      required: false
      description: 페이지 크기 1~100, 기본 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 nextCursor. 불투명 문자열.
      schema:
        type: string
    ShareToken:
      name: token
      in: path
      required: true
      description: 공유 토큰. 128비트 난수의 base64url(패딩 없음) 22자. 형식이 다르면 404(SHARE_NOT_FOUND).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{22}$'
    TtlDays:
      name: ttlDays
      in: query
      required: false
      description: 공유 링크 유효 기간(일) 1~30. 생략하면 서버 설정 share.ttl-days(기본 7).
      schema:
        type: integer
        minimum: 1
        maximum: 30
    Rater:
      name: rater
      in: path
      required: true
      description: |
        평가자 이름. 앞뒤 공백을 뺀 뒤 1~40자(유니코드 문자 수). `/` `\` `;`·제어 문자는 쓸 수 없고 점(.)만으로 된 이름도 안 된다
        (아니면 400 INVALID_REQUEST). 대소문자를 구분한다. 웹 페이지는 encodeURIComponent 로 넣는다.
      schema:
        type: string
        minLength: 1
        maxLength: 40
    ExportFormat:
      name: format
      in: query
      required: false
      description: 응답 형식. 대소문자 무시. 그 밖의 값은 400.
      schema:
        type: string
        enum: [json, csv]
        default: json
    IncludePassthrough:
      name: includePassthrough
      in: query
      required: false
      description: true 면 패스스루 실행(passthrough=true)의 행도 넣는다. 기본 false(METRICS §1 제외 규칙).
      schema:
        type: boolean
        default: false
    PetId:
      name: petId
      in: path
      required: true
      description: 반려동물 ID (UUID). 없는 값·형식이 다른 값은 404(PET_NOT_FOUND).
      schema:
        type: string
        format: uuid
    WithJobs:
      name: withJobs
      in: query
      required: false
      description: true 면 펫의 끝난 작업도 지운다(deletePet 설명의 규칙). 기본 false — 작업은 미분류로 남긴다.
      schema:
        type: boolean
        default: false
  responses:
    BadRequest:
      description: 잘못된 요청 (INVALID_REQUEST, NO_PHOTOS, TOO_MANY_PHOTOS, UNSUPPORTED_IMAGE_TYPE)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CreateJobBadRequest:
      description: >-
        잘못된 요청 (INVALID_REQUEST, NO_PHOTOS, TOO_MANY_PHOTOS, UNSUPPORTED_IMAGE_TYPE) 또는 대표 사진 검사 거절
        (UNREADABLE_IMAGE, IMAGE_TOO_SMALL, NO_ANIMAL_DETECTED, TOO_MANY_ANIMALS, ANIMAL_TOO_SMALL, IMAGE_TOO_DARK,
        IMAGE_TOO_BLURRY)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 없음 (JOB_NOT_FOUND, ASSET_NOT_FOUND, NOT_FOUND, PET_NOT_FOUND)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 상태 충돌 (JOB_NOT_COMPLETED, JOB_NOT_FAILED, JOB_NOT_PENDING, JOB_IN_PROGRESS)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 용량 초과 (PAYLOAD_TOO_LARGE) — 장당 5 MB 또는 요청 전체 20 MB 초과
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 서버 오류 (INTERNAL_ERROR)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QueueFull:
      description: >-
        생성 대기열이 가득 참 (QUEUE_FULL) — 작업을 만들지도, 다시 대기열에 넣지도 않았다. Retry-After 초 뒤에 다시 보낸다.
        PENDING 작업과 접수 중인 요청을 더한 수가 서버 상한(admission.max-pending, 기본 꺼짐)에 이를 때만 온다.
        queuedAt 이 admission.stale-after-ms(기본은 정상 작업의 가장 긴 대기, prod·N 19·c 1 이면 2시간 56분)보다 오래된 PENDING 은
        세지 않는다(돌릴 워커가 없는 작업을 위한 안전망, ERROR_CODES.md '대기열 상한').
        2026-11-21 안건 #21 결정(N 19, Retry-After 165 s — 5차 부하 시험 뒤 다시 계산할 수 있음), api-v1.1.
        운영 서버는 Unity 새 빌드와 5차 부하 시험 전까지 상한을 꺼 둔다.
      headers:
        Retry-After:
          description: 다시 보내기까지 기다릴 초(정수, 1 이상). 서버 설정 admission.retry-after-seconds.
          schema:
            type: integer
            minimum: 1
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShareNotFound:
      description: 공유 링크 없음 (SHARE_NOT_FOUND) — 없는 토큰·만료·취소·지워진 작업을 구분하지 않는다. error.jobId 는 비운다.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EventsBadRequest:
      description: >-
        잘못된 이벤트 묶음 (INVALID_REQUEST) — JSON 이 아님, installId·sessionId 가 UUID 가 아님, appVersion·platform 형식,
        events 가 1~50개가 아님(51개 이상 포함), 다른 사이트의 페이지에서 보낸 요청. 아무것도 저장하지 않는다.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EventsTooLarge:
      description: 본문이 32 KB(32,768 바이트)를 넘음 (PAYLOAD_TOO_LARGE). 아무것도 저장하지 않는다. 묶음을 나눠 다시 보낸다.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    JobResponse:
      type: object
      description: 작업 상태. 서버 내부 경로는 포함하지 않는다.
      required: [id, status, createdAt, updatedAt, timings, uploadedFiles]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            작업 상태. PENDING(대기) → PROCESSING(생성 중) → COMPLETED(완료, asset 사용 가능) | FAILED(실패, error 참조).
            FAILED 는 retry 로 PENDING 으로 돌아갈 수 있다. PENDING 은 cancel 로 FAILED(error.code=CANCELED)가 될 수 있다.
            클라이언트는 알 수 없는 값을 받으면 크래시 대신 UNKNOWN 으로 처리한다.
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        progress:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: 진행률 0~1. 서버가 알 수 없으면 null. Mock 은 PENDING 0.0, PROCESSING 0.5, COMPLETED 1.0, FAILED null.
        createdAt:
          type: string
          format: date-time
          description: 작업 생성 시각 (ISO 8601, UTC)
        updatedAt:
          type: string
          format: date-time
          description: 마지막 상태 변경 시각 (ISO 8601, UTC)
        timings:
          $ref: '#/components/schemas/Timings'
        asset:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AssetInfo'
          description: COMPLETED 일 때 기본(base) 에셋 정보. 그 외 상태에서는 null.
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/JobError'
          description: FAILED 일 때 실패 원인. 그 외 상태에서는 null.
        uploadedFiles:
          type: array
          description: 업로드된 사진의 원본 파일명과 크기. 서버 저장 경로는 포함하지 않는다.
          items:
            $ref: '#/components/schemas/UploadedFile'
        queue:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/JobQueue'
          description: PENDING 일 때 대기열 위치. 그 외 상태에서는 null.
        estimate:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/JobEstimate'
          description: |
            PENDING·PROCESSING 일 때 남은 시간 추정치. 추정의 근거가 될 최근 완료 실행이 없으면(서버를 처음 띄운 직후 등)
            객체 자체가 null. 그 외 상태에서는 null.
        petId:
          type: string
          format: uuid
          nullable: true
          description: |
            이 작업이 들어 있는 보관함의 반려동물(tag pets). 만든 직후에는 모든 작업이 null = 미분류이고, 보관함 웹이
            PUT /api/v1/jobs/{jobId}/pet 으로 넣으면 그 펫이다. 공개 GET 에도 나오지만 이 UUID 로 할 수 있는 일은 모두 인증 뒤다.
    Timings:
      type: object
      description: |
        단계별 소요 시간(ms). queuedMs 는 PENDING 동안의 경과(진행 중이면 현재까지, 이후 고정),
        processingMs 는 PROCESSING 시작 전 null, 진행 중이면 현재까지, 종료 후 고정.
        totalMs 는 COMPLETED/FAILED 전 null, 이후 (종료 시각 − 접수 시각). retry 하면 재시도 시점부터 다시 잰다.
      required: [queuedMs]
      properties:
        queuedMs:
          type: integer
          format: int64
        processingMs:
          type: integer
          format: int64
          nullable: true
        totalMs:
          type: integer
          format: int64
          nullable: true
    AssetInfo:
      type: object
      description: 다운로드 가능한 GLB 정보. 파일 계약은 docs/asset/GLB_SPEC.md.
      required: [url, bytes, variant, contentType]
      properties:
        url:
          type: string
          description: 서버 루트 기준 상대 경로. 앱은 baseUrl 과 결합한다. 예 `/api/v1/jobs/{jobId}/asset?variant=base`
        bytes:
          type: integer
          format: int64
          description: 파일 크기(바이트). Mock 샘플이 0바이트이면 0 이 올 수 있다.
        variant:
          type: string
          description: 에셋 종류. 지금은 base(생성된 GLB) 하나뿐이다(hair 는 2026-11-21 에 계약에서 뺐다). 클라이언트는 알 수 없는 값을 받으면 크래시 대신 UNKNOWN 으로 처리한다.
          enum: [base]
        contentType:
          type: string
          description: 항상 model/gltf-binary
          example: model/gltf-binary
    JobError:
      type: object
      description: 작업 실패 원인. code 목록과 앱 표시 문구는 docs/api/ERROR_CODES.md.
      required: [code, message]
      properties:
        code:
          type: string
          description: ERROR_CODES.md 의 Job 실패 코드(INFERENCE_FAILED, INFERENCE_TIMEOUT, INFERENCE_UNAVAILABLE, CONVERSION_FAILED, INTERNAL_ERROR, CANCELED). 알 수 없는 코드는 일반 실패 문구로 처리한다.
          example: INFERENCE_FAILED
        message:
          type: string
          description: 개발자용 설명(영문). 사용자에게 그대로 보여주지 않는다.
    UploadedFile:
      type: object
      required: [name, bytes]
      properties:
        name:
          type: string
          description: 클라이언트가 보낸 원본 파일명(경로 제거)
        bytes:
          type: integer
          format: int64
    JobCreatedResponse:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
    JobListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobResponse'
        nextCursor:
          type: string
          nullable: true
          description: 다음 페이지 cursor. 마지막 페이지면 null.
    ErrorResponse:
      type: object
      description: 모든 오류 응답의 공통 봉투. v0(/api/jobs)의 평면 문자열 오류와 다르다.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: docs/api/ERROR_CODES.md 의 HTTP 오류 코드. 앱은 code 로 문구를 고르고, 알 수 없는 코드는 일반 오류 문구로 처리한다.
          example: JOB_NOT_COMPLETED
        message:
          type: string
          description: 개발자용 설명(영문). 사용자에게 그대로 보여주지 않는다.
        jobId:
          type: string
          nullable: true
          description: 오류가 특정 작업에 관한 것이면 그 jobId.
    HealthResponse:
      type: object
      required: [status, profile, workerType]
      properties:
        status:
          type: string
          example: ok
        profile:
          type: string
          description: |
            활성 Spring 프로파일을 활성화 순서대로 쉼표로 이은 값(공백 없음). 예 `mock`, `real`. 공개 서버(prod)는
            `real,prod` 를 돌려준다. 활성 프로파일이 없으면 기본 프로파일(`mock`). 앱은 값을 그대로 표시하거나 로그에 남기고,
            `mock` | `real` 과 같다고 가정하지 않는다(워커 종류는 workerType).
          example: mock
        workerType:
          type: string
          description: 작업을 처리하는 워커 종류 (mock | real)
          example: mock
    ShareCreatedResponse:
      type: object
      description: 새 공유 링크. 같은 토큰의 정보 조회 경로는 Location 헤더.
      required: [token, url, expiresAt]
      properties:
        token:
          type: string
          description: 128비트 난수의 base64url(패딩 없음) 22자
          example: q3Zr8yT0bWm1xK4vL9pN2A
        url:
          type: string
          description: 웹 뷰어 페이지. 서버 루트 기준 상대 경로 `/s/{token}`. 클라이언트가 baseUrl 과 결합해 링크·QR 로 쓴다.
          example: /s/q3Zr8yT0bWm1xK4vL9pN2A
        expiresAt:
          type: string
          format: date-time
          description: 만료 시각 (ISO 8601, UTC). 이 시각부터 404(SHARE_NOT_FOUND).
    SharesRevokedResponse:
      type: object
      description: DELETE /api/v1/jobs/{jobId}/shares 의 결과.
      required: [revoked]
      properties:
        revoked:
          type: integer
          format: int32
          minimum: 0
