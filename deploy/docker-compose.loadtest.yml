# 부하 시험 덮어쓰기: backend 서비스만 바꾼다. caddy·caddy_data(인증서)·prometheus·grafana 는 그대로다.
# 절차(팀 공지 → 운영 백업 → 띄우기 → 합성 GLB → k6 → 수집 → 복구 → 확인)는 deploy/loadtest/README.md.
# 리포 루트에서 기본 파일 뒤에 덧붙인다(같은 프로젝트 beside, 같은 서비스 이름이라 운영 backend 컨테이너를 대신한다 —
# 4GB VM 에 backend 두 개는 못 띄운다):
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile monitoring \
#     -f deploy/docker-compose.loadtest.yml up -d backend
# 아래 ${...} 값은 그 명령 앞의 셸 환경변수로 바꾼다(deploy/.env 보다 우선). 예: G 시리즈
#   LOADTEST_PROFILES=real,prod LOADTEST_INFERENCE_BASE_URL=http://100.x.y.z:8001 docker compose ... up -d backend
#
# 환경변수 → Spring 속성(점 → _, 대시 삭제, 대문자; application*.properties 와 @Value 이름으로 확인):
#   MOCK_WORKER_PENDINGMS ↔ mock.worker.pending-ms, SPRING_TASK_EXECUTION_POOL_CORESIZE ↔ spring.task.execution.pool.core-size,
#   STORAGE_BACKUP_ENABLED ↔ storage.backup.enabled, INFERENCE_TIMEOUTMS ↔ inference.timeout-ms 등.

services:
  backend:
    environment:
      # A 시리즈(API 계층) = mock,prod, G 시리즈(GPU 큐) = real,prod + 추론 스텁. prod 는 늘 마지막(H2 콘솔·Swagger off,
      # forward-headers, 사진 시그니처 검사 — k6 사진은 진짜 PNG/JPEG 여야 한다).
      SPRING_PROFILES_ACTIVE: ${LOADTEST_PROFILES:-mock,prod}
      # Prometheus 공통 태그 env. Grafana 'Beside 운영' 에서 env=loadtest 로 운영 지표와 나눠 본다.
      METRICS_ENV: loadtest
      # 웹훅 끔(notify.webhook-url 이 비면 알림을 보내지 않는다). 수천 건의 완성·실패 알림이 팀 채널로 가지 않게.
      NOTIFY_WEBHOOKURL: ""
      # prod 의 매일 04:30 H2 온라인 백업(DatabaseBackup, @ConditionalOnProperty storage.backup.enabled=true) 끔.
      STORAGE_BACKUP_ENABLED: "false"
      # mock 워커: 바로 PROCESSING(0 ms), 60초 뒤 COMPLETED(합성 GLB). GPU 생성을 뺀 API 계층만 잰다.
      MOCK_WORKER_PENDINGMS: ${MOCK_WORKER_PENDINGMS:-0}
      MOCK_WORKER_PROCESSINGMS: ${MOCK_WORKER_PROCESSINGMS:-60000}
      # @Async 풀(applicationTaskExecutor). 기본 8 이면 mock 이 'GPU 8대'처럼 동작해 9번째 작업부터 PENDING 에 머문다.
      # 큐가 무한(queue-capacity 기본)이라 스레드 수는 core-size 가 정한다.
      SPRING_TASK_EXECUTION_POOL_CORESIZE: ${SPRING_TASK_EXECUTION_POOL_CORESIZE:-400}
      # G 시리즈(real)만 쓰는 값. 실제 GPU PC 는 부르지 않는다: 기본값은 아무 데도 닿지 않는 주소(컨테이너 안 127.0.0.1:9)이고
      # 운영 INFERENCE_TOKEN 도 넘기지 않는다. 스텁 주소·토큰은 LOADTEST_INFERENCE_* 로 그때 넣는다.
      INFERENCE_BASEURL: ${LOADTEST_INFERENCE_BASE_URL:-http://127.0.0.1:9}
      INFERENCE_TOKEN: ${LOADTEST_INFERENCE_TOKEN:-}
      INFERENCE_TRANSFER: upload
      # 운영(10분 / 30분)보다 짧게. F1b(타임아웃) 는 20000, F2(GPU 꺼짐) 는 운영과 같은 1800000 으로 바꿔 띄운다.
      INFERENCE_TIMEOUTMS: ${LOADTEST_INFERENCE_TIMEOUT_MS:-120000}
      INFERENCE_OFFLINEWAITMS: ${LOADTEST_INFERENCE_OFFLINE_WAIT_MS:-300000}
      # 동시에 보내는 /infer 수(G2 의 c = 1, 2, 4). 스텁의 BESIDE_PASSTHROUGH_SLOTS 와 같게 둔다.
      INFERENCE_MAXCONCURRENCY: ${LOADTEST_INFERENCE_MAX_CONCURRENCY:-1}
    volumes:
      # 운영 볼륨 beside-storage 대신(같은 /app/storage 로 덮어쓴다). 부하 작업·업로드·events.jsonl 은 여기에만 쌓인다.
      - beside-loadtest-storage:/app/storage

volumes:
  beside-loadtest-storage:
    # 이름 고정(정리 명령: docker volume rm beside-loadtest-storage). 운영 볼륨 beside-storage 와 헷갈리지 않게.
    name: beside-loadtest-storage
