# Loki 설정 (deploy/docker-compose.yml 의 loki 서비스, profile monitoring).
# 하나의 프로세스(single binary)가 받기·저장·질의를 다 한다. 저장은 볼륨 loki_data 의 파일이다.
# 로그는 Alloy(deploy/monitoring/alloy/config.alloy)가 Docker 로그 파일에서 읽어 보낸다.
# 바꾼 뒤: docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile monitoring restart loki
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-11-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 보관 7일. 로그에는 jobId·경로·User-Agent 가 있다(공유 토큰은 앞 6자만, IP 는 Caddy 접근 로그에 있다).
  # 종강(12/21) 정리 때 볼륨 loki_data 를 지운다(deploy/README '비용과 끝내기').
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # 부하 시험 A1 185 요청/s 의 Caddy 접근 로그가 초당 약 0.2 MB 다 [계산: 한 줄 약 1 KB]. 넉넉히 둔다.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

# 밖으로 나가는 사용 통계를 끈다(Grafana 와 같다).
analytics:
  reporting_enabled: false
