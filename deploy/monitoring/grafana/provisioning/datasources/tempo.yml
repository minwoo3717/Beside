# Grafana 데이터소스: compose 내부망의 Tempo(2026-11-26 W8 분산 추적). backend 가 보낸 트레이스를 본다.
# 업로드 요청 하나 = 트레이스 하나(2026-11-27 고침, 배포 창 3 부터): 서버 span 'http post /api/v1/jobs' 아래에 beside.upload.check·
# beside.upload.save·beside.job.dispatch-wait·beside.job.run(태그 beside.request_id)이 형제로 있고, 앱이 traceparent 를 보내면
# trace id = 앱 흐름의 X-Request-Id 다. flags 00 이거나 서버가 재시작해 잊은 작업은 run 이 따로 루트(링크 beside.dispatched.trace_id).
# 찾기: Explore → Tempo → Search 의 Span Name 'beside.job.run', 또는 TraceQL {name="beside.job.run" && span.jobId="<jobId>"}.
# Loki 로그 줄의 traceId 를 눌러도 온다(loki.yml).
# 이 파일의 '$$' 는 Grafana 가 환경 변수로 바꾸지 않게 한 것이다(화면에서는 '$' 하나로 보인다).
apiVersion: 1

datasources:
  - name: Tempo
    uid: beside-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      # span 에서 그 트레이스의 로그로: backend 의 JSON 줄에는 "traceId" 필드가 있다(logback-spring.xml). Caddy 줄에는 앱이 보낸
      # traceparent 헤더(trace id 포함)가, 추론 서비스(inference, Pod 가 로그를 보낼 때) 줄에는 trace= 가 있다.
      tracesToLogsV2:
        datasourceUid: beside-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        customQuery: true
        query: '{service=~"backend|caddy|inference"} |= "$${__trace.traceId}"'
      nodeGraph:
        enabled: true
      search:
        hide: false
