# Grafana 대시보드 공급자: /etc/grafana/dashboards(= deploy/monitoring/grafana/dashboards)의 JSON 을 'Beside' 폴더에 넣는다.
# 화면에서 고친 내용은 저장되지 않는다(allowUiUpdates: false). 바꾸려면 JSON 을 고쳐 커밋한다 — Grafana 의
# Share → Export → 'Export for sharing externally' 를 끄고 저장한 JSON 을 그대로 덮어쓰면 된다.
apiVersion: 1

providers:
  - name: beside
    orgId: 1
    folder: Beside
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
