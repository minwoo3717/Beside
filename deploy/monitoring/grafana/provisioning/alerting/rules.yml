# Grafana 알림 규칙(파일 공급). 지표·로그 모두 운영만 본다: 지표는 env="prod", backend 로그는 env 라벨이 loadtest·local 이 아닌 줄
# (env 라벨이 없는 옛 줄도 본다), Caddy 로그는 k6 요청(X-Request-Id lt-*)을 뺀 줄. 부하 시험·스테이징의 env="loadtest" 는 울리지 않는다.
# 수집기 감시(up{job="loki|alloy|tempo"}, Alloy 쓰기 실패)는 VM 의 컨테이너 자체라 env 가 없다(2026-11-27). GPU Pod 로그(service="inference")는
# Pod 가 보낸 env="prod" 줄만 본다(2026-11-27).
# 만든 곳: 2026-11-25 멘토링 '모니터링을 해야 장애 감지가 빠르다'. 그 전에는 지표 알림이 0개였다(대시보드는 사람이 볼 때만 쓸모).
# 이 파일은 scratchpad 의 생성기에서 만들었다. 규칙을 고칠 때는 아래 구조를 그대로 따른다:
#   A = 순간 질의, C = A 의 임계값. 데이터 없음(트래픽 없음)은 정상(OK)으로 본다.
apiVersion: 1

groups:
  - orgId: 1
    name: beside-prod
    folder: Beside 알림
    interval: 1m
    rules:
      - uid: beside-backend-down
        title: "backend 지표 수집 실패"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "up{job=\"beside-backend\"}", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "lt", "params": [1]}}]}
        noDataState: OK
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: "🔴 backend 지표를 2분 넘게 못 읽었다. backend 가 죽었거나 멈췄다(VM 감시 R4 가 재시작하는지 RUNBOOK '먼저 볼 곳')."
        labels:
          severity: critical
      - uid: beside-5xx-ratio
        title: "5xx 비율 (QUEUE_FULL 제외)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "(clamp_min(sum(rate(http_server_requests_seconds_count{env=\"prod\",status=~\"5..\"}[5m])) - (sum(rate(beside_jobs_refused_total{env=\"prod\"}[5m])) or vector(0)), 0) / sum(rate(http_server_requests_seconds_count{env=\"prod\"}[5m]))) and on() (sum(increase(http_server_requests_seconds_count{env=\"prod\",status=~\"5..\"}[5m])) >= 3)", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0.05]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "5xx 응답이 5 %를 넘는다(의도한 503 QUEUE_FULL 제외, 5분에 3건 이상). Grafana 'Beside 로그' 의 backend ERROR 를 본다."
        labels:
          severity: warning
      - uid: beside-poll-latency
        title: "작업 조회 응답 p95 > 0.5 s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{env=\"prod\",method=\"GET\",uri=\"/api/v1/jobs/{jobId}\"}[2m])))", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0.5]}}]}
        noDataState: OK
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: "작업 조회(폴링) p95 가 0.5 s 를 넘은 지 2분(목표 0.3 s, docs/ops/SLO.md). 평소 약 0.01~0.02 s 다. CPU·Caddy·backend 앞 네트워크를 본다. 2026-11-26 스테이징 훈련 S1·S2 에서 옛 규칙(라벨 {id}, 1 s 10분)은 한 번도 울리지 않았다."
        labels:
          severity: warning
      - uid: beside-upload-latency
        title: "업로드 응답 p95 > 5 s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{env=\"prod\",method=\"POST\",uri=\"/api/v1/jobs\"}[10m])))", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [5]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "업로드(POST /api/v1/jobs) p95 가 5 s 를 넘은 지 5분. 사진 검사·배경 제거를 포함해 평소 약 2 s 다."
        labels:
          severity: warning
      - uid: beside-queue-wait
        title: "대기 시간 p95 > 60 s (증설 기준)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(beside_job_queued_seconds_bucket{env=\"prod\"}[10m])))", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [60]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        isPaused: false
        annotations:
          summary: "GPU 대기 p95 가 60 s 를 넘은 지 10분. GPU 증설 기준 [제안값](TRAFFIC_MODEL 4절)에 닿았다."
        labels:
          severity: warning
      - uid: beside-queue-length
        title: "대기열 19건 이상"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "max_over_time(beside_jobs_queue{env=\"prod\",state=\"pending\"}[5m])", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [18]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "대기 중 작업이 19건 이상(큐 상한 N 과 같은 수)인 지 5분. 상한이 꺼져 있으면 기다리는 사람이 600 s 를 넘길 수 있다."
        labels:
          severity: warning
      - uid: beside-heap-after-gc
        title: "GC 뒤 힙 > 75 %"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "max(jvm_memory_usage_after_gc_percent{env=\"prod\",area=\"heap\",pool=\"long-lived\"})", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0.75]}}]}
        noDataState: OK
        execErrState: Error
        for: 10m
        isPaused: false
        annotations:
          summary: "GC 뒤에도 long-lived 힙이 75 %를 넘은 지 10분(부하 합격 기준과 같은 선). 메모리 누수나 큰 요청을 의심한다."
        labels:
          severity: warning
      - uid: beside-asset-failures
        title: "에셋 다운로드 실패율 > 5 %"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "(sum(increase(beside_asset_downloads_total{env=\"prod\",outcome=~\"client_abort|error\"}[1h])) / sum(increase(beside_asset_downloads_total{env=\"prod\",outcome=~\"ok|client_abort|error\"}[1h]))) and on() (sum(increase(beside_asset_downloads_total{env=\"prod\",outcome=~\"client_abort|error\"}[1h])) >= 3)", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0.05]}}]}
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: "지난 1시간 GLB 다운로드 실패(끊김·오류)가 5 %를 넘는다(3건 이상)."
        labels:
          severity: warning
      - uid: beside-job-failures
        title: "작업 실패가 이어짐"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "(sum(increase(beside_jobs_finished_total{env=\"prod\",result=\"FAILED\",code!=\"CANCELED\"}[1h])) / sum(increase(beside_jobs_finished_total{env=\"prod\",code!=\"CANCELED\"}[1h]))) and on() (sum(increase(beside_jobs_finished_total{env=\"prod\",result=\"FAILED\",code!=\"CANCELED\"}[1h])) >= 3)", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0.2]}}]}
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: "지난 1시간 끝난 작업의 20 % 넘게 실패했다(3건 이상). 코드별로는 'Beside 운영' 의 '끝난 작업' 패널."
        labels:
          severity: warning
      - uid: beside-gpu-down-with-jobs
        title: "GPU 꺼짐 + 기다리는 작업"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "max(beside_inference_state{env=\"prod\",state=\"DOWN\"}) * on() (max(beside_jobs_queue{env=\"prod\",state=\"pending\"}) > bool 0)", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "🔴 추론 서비스(GPU)가 DOWN 인데 기다리는 작업이 있는 지 5분. 작업은 최대 30분 기다린 뒤 INFERENCE_UNAVAILABLE 로 끝난다. RUNBOOK 'GPU Pod 다시 세우기'."
        labels:
          severity: critical
      - uid: beside-edge-latency
        title: "앞단(Caddy) 작업 조회 p95 > 1 s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: beside-loki
            model: {"refId": "A", "expr": "quantile_over_time(0.95, {service=\"caddy\"} | json | request_method=\"GET\" | request_uri=~\"/api/v1/jobs/[0-9a-f-]+\" | json rid=`request.headers[\"X-Request-Id\"][0]` | rid !~ \"lt-.*\" | unwrap duration | __error__=\"\" [2m]) by (service)", "queryType": "instant"}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [1]}}]}
        noDataState: OK
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: "앞단(Caddy)에서 잰 작업 조회(GET /api/v1/jobs/{id}) p95 가 1 s 를 넘은 지 2분. Spring 지표에는 backend 앞 네트워크·Caddy 대기열 지연이 안 보인다(2026-11-26 스테이징 훈련 S2: 앞단 17.8 s 동안 Spring 0.025 s). 작업 조회만 본다: Grafana 웹소켓(연결 내내 한 줄)·GLB 다운로드·업로드는 원래 길어 트래픽이 적을 때 p95 를 끌어올린다(2026-11-26 배포 전 검토). 부하 시험의 k6 요청(X-Request-Id lt-*)은 뺀다(2026-11-27). Grafana 'Beside 로그' 의 Caddy 응답 시간과 'Beside 운영' 의 CPU 를 본다."
        labels:
          severity: warning
      - uid: beside-backend-errors
        title: "backend ERROR 로그"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: beside-loki
            model: {"refId": "A", "expr": "sum(count_over_time({service=\"backend\", level=\"ERROR\", env!~\"loadtest|local\"} | json | logger_name!~\"io[.]opentelemetry[.].*\" [5m]))", "queryType": "instant"}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: "backend 가 지난 5분에 ERROR 로그를 남겼다. Grafana 'Beside 로그' 의 'backend · inference ERROR · WARN' 에서 requestId·jobId 로 따라간다. 트레이스 내보내기 실패(io.opentelemetry)는 따로 '트레이스 내보내기 실패' 알림이 본다."
        labels:
          severity: warning
      - uid: beside-trace-export
        title: "트레이스 내보내기 실패 (tempo)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-loki
            model: {"refId": "A", "expr": "sum(count_over_time({service=\"backend\", level=\"ERROR\", env!~\"loadtest|local\"} | json | logger_name=~\"io[.]opentelemetry[.].*\" [10m]))", "queryType": "instant"}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: "backend 가 지난 10분에 트레이스를 tempo 로 보내지 못했다(OpenTelemetry 내보내기 ERROR, 1분에 최대 5줄). 작업에는 영향 없다. tempo 컨테이너가 떠 있는지(메모리 상한 384m) 본다. 'backend ERROR 로그' 와 나눈 이유: 한 알림에 묶이면 tempo 가 꺼진 동안 그 알림이 계속 울린 상태라 진짜 오류가 새 메시지 없이 묻힌다(반복 4시간, 2026-11-26 배포 전 검토)."
        labels:
          severity: warning
      - uid: beside-loki-down
        title: "Loki 지표 수집 실패 (로그 저장 멈춤)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "up{job=\"loki\"}", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "lt", "params": [1]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "Loki 를 5분 넘게 못 읽었다. 그동안 로그가 저장되지 않고, 로그 알림(앞단 지연·backend ERROR·트레이스 내보내기)도 판단하지 못한다. Alloy 가 잠시 다시 보내다 못 보낸 줄은 버린다('Alloy 로그 전송 실패'). VM 에서 docker compose(--profile monitoring)의 ps loki · logs --tail 50 loki 를 본다(메모리 상한 384m). 다시 띄우기는 up -d --no-deps loki(deploy/README '로그 · 알림')."
        labels:
          severity: warning
      - uid: beside-alloy-down
        title: "Alloy 지표 수집 실패 (로그 수집 멈춤)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "up{job=\"alloy\"}", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "lt", "params": [1]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "로그 수집기 Alloy 를 5분 넘게 못 읽었다. 그동안 새 로그가 Loki 에 들어오지 않는다. 다시 뜨면 볼륨에 남은 읽은 위치부터 이어 읽지만, 그 사이 Docker 로그 파일(서비스마다 10 MB × 5)이 돌아 지워진 줄은 잃는다. VM 에서 docker compose(--profile monitoring)의 ps alloy · logs --tail 50 alloy 를 본다(메모리 상한 384m, 2026-11-26 훈련 때 부하 없이 230 MiB)."
        labels:
          severity: warning
      - uid: beside-tempo-down
        title: "Tempo 지표 수집 실패 (트레이스 저장 멈춤)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "up{job=\"tempo\"}", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "lt", "params": [1]}}]}
        noDataState: OK
        execErrState: Error
        for: 5m
        isPaused: false
        annotations:
          summary: "Tempo 를 5분 넘게 못 읽었다. 그동안 트레이스가 저장되지 않는다(작업에는 영향 없음). backend 가 보내지 못하면 '트레이스 내보내기 실패' 도 울린다. VM 에서 docker compose(--profile monitoring)의 ps tempo · logs --tail 50 tempo 를 본다(메모리 상한 384m)."
        labels:
          severity: warning
      - uid: beside-alloy-dropped
        title: "Alloy 로그 전송 실패 (Loki 에 못 쓴 줄)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: beside-prometheus
            model: {"refId": "A", "expr": "sum(increase(loki_write_dropped_entries_total[10m]))", "instant": true, "range": false}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0]}}]}
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: "Alloy 가 지난 10분에 로그 줄을 Loki 에 쓰지 못하고 버렸다(Alloy 자체 지표 loki_write_dropped_entries_total). 그 구간의 로그는 'Beside 로그' 에 없다. Loki 가 떠 있는지('Loki 지표 수집 실패')와 alloy 컨테이너 로그(logs --tail 50 alloy)를 본다. 로그가 0줄 들어오는 것을 보는 규칙은 두지 않는다: 조용한 밤에도 울린다."
        labels:
          severity: warning
      - uid: beside-inference-errors
        title: "추론 서비스(GPU Pod) ERROR 로그"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: beside-loki
            model: {"refId": "A", "expr": "sum(count_over_time({service=\"inference\", env=\"prod\", level=\"ERROR\"} [5m]))", "queryType": "instant"}
          - refId: C
            datasourceUid: __expr__
            model: {"refId": "C", "type": "threshold", "expression": "A", "conditions": [{"evaluator": {"type": "gt", "params": [0]}}]}
