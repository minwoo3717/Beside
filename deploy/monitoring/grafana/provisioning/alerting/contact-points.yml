# Grafana 알림 보낼 곳: Discord 웹훅 하나.
# 주소는 compose 가 넘기는 GRAFANA_ALERT_WEBHOOK_URL 이다(deploy/.env). 비어 있으면 compose 가 backend 의
# NOTIFY_WEBHOOK_URL(같은 팀 채널)을 쓰고, 그것도 비면 보내지 않는 자리 주소가 들어간다(Grafana 가 뜨기는 한다).
# 비밀값이라 리포에 두지 않는다. Grafana 가 '$VAR' 를 환경 변수로 바꾼다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: beside-discord
    receivers:
      - uid: beside-discord
        type: discord
        disableResolveMessage: false
        settings:
          url: ${GRAFANA_ALERT_WEBHOOK_URL}
          use_discord_username: false
          title: 'Beside 지표 알림'
          message: |-
            {{ range .Alerts }}{{ if eq .Status "firing" }}📈 {{ else }}✅ 해제: {{ end }}{{ .Annotations.summary }}
            {{ end }}
