# Prometheus 설정 (deploy/docker-compose.yml 의 prometheus 서비스, profile monitoring).
# 바꾼 뒤: docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile monitoring restart prometheus
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # Spring Actuator 관리 포트(management.server.port=8081). compose 내부망에서만 닿는다 — 공개 8080 에는 /actuator 가 없다.
  # 지표에는 공통 태그 env(prod | loadtest | local)가 붙어 있어, 부하 시험 덮어쓰기로 바꿔 띄워도 같은 대상에서 구분된다.
  - job_name: beside-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  # Prometheus 자신(수집 실패·메모리 확인용).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 로그·트레이스 수집기 감시(2026-11-27): 수집기가 죽으면 로그·트레이스가 조용히 끊기므로 up{job="loki|alloy|tempo"} 를 알림이 본다
  # (provisioning/alerting/rules.yml). 셋 다 compose 내부망의 /metrics 다(alloy 는 compose 의 --server.http.listen-addr=0.0.0.0:12345).
  # 셋의 자체 지표는 수천 개라 디스크 상한(retention.size 1GB)을 backend 지표와 나눠 먹지 않게 필요한 것만 남긴다. up 은 Prometheus 가
  # 스스로 만드는 값이라 아래 keep 과 상관없이 남는다.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "process_resident_memory_bytes|go_memstats_heap_inuse_bytes|loki_distributor_lines_received_total|loki_discarded_samples_total|loki_ingester_memory_streams"
        action: keep

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "process_resident_memory_bytes|go_memstats_heap_inuse_bytes|loki_write_.*|loki_source_.*|otelcol_receiver_.*|otelcol_exporter_.*"
        action: keep

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "process_resident_memory_bytes|go_memstats_heap_inuse_bytes|tempo_distributor_spans_received_total|tempo_discarded_spans_total|tempo_ingester_live_traces"
        action: keep
