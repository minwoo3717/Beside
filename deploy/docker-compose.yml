# Beside 클라우드 VM 구성: Spring 백엔드(real,prod) + Caddy(자동 HTTPS · Basic 인증 · v0/H2/Swagger/Actuator 차단).
# GPU 추론 서비스는 VM 이 아니라 Runpod Pod(대안: 팀원 GPU PC)에 있고 Tailscale 사설망(100.x)으로 부른다.
# 리포 루트에서:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# 모니터링(Prometheus + Grafana)까지 띄우려면 --profile monitoring 을 붙인다(README '모니터링').
# 부하 시험은 deploy/docker-compose.loadtest.yml 을 덧붙인다(deploy/loadtest/README.md).
# 절차·확인·백업은 deploy/README.md.
name: beside

# 모든 서비스의 컨테이너 로그(docker compose logs)를 10MB × 5개로 돌린다. 기본 json-file 은 끝없이 커져 디스크를 채운다.
# labels: 로그 파일의 줄마다 컨테이너 라벨 com.docker.compose.service 를 "attrs" 로 넣는다. 로그 수집기가 docker.sock
# 없이 /var/lib/docker/containers/*/*-json.log 만 읽고도 backend·caddy 를 가를 수 있다. 바꾸면 다음 up -d 에서
# 컨테이너가 다시 만들어진다(backend 진행 중 작업은 INTERNAL_ERROR).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    labels: "com.docker.compose.service"

services:
  backend:
    build:
      context: ../backend
    image: beside-backend:local
    restart: unless-stopped
    # 정지(compose stop·up -d 의 재생성·docker restart) 때 SIGTERM 뒤 SIGKILL 까지 기다리는 시간. Docker 기본은 10 s.
    # 2026-11-26 전환 훈련에서 backend 가 10 s 안에 안 끝나 SIGKILL(137)로 죽었다(H2 를 닫지 못함): Spring 의 @Async
    # 실행기가 GPU 를 기다리는 작업을 30 s 까지 기다렸다. 이제 작업은 종료 신호에 바로 끝나(ShutdownSignal) 정지는 약 1 s,
    # 앱 안의 대기 상한은 5 s(spring.lifecycle.timeout-per-shutdown-phase)다. 30 s 는 그 뒤 빈 닫기(전처리 모델·H2·
    # 트레이스 내보내기)가 느려도 H2 가 정상으로 닫히게 두는 여유다. 정상 정지는 이 값만큼 기다리지 않는다.
    # 기록: docs/ops/2026-11-27_backend-stop.md
    stop_grace_period: 30s
    environment:
      # prod 가 마지막이어야 real 의 설정(H2 콘솔 등)을 덮어쓴다.
      SPRING_PROFILES_ACTIVE: real,prod
      # Spring 은 환경변수 이름을 점 → _, 대시 삭제, 대문자로 읽는다: inference.base-url ↔ INFERENCE_BASEURL.
      INFERENCE_BASEURL: ${INFERENCE_BASE_URL:?deploy/.env 에 INFERENCE_BASE_URL 을 넣는다 (Runpod Pod 또는 GPU PC 의 Tailscale 주소)}
      # 사진을 /infer/upload 로 올리고 GLB 를 받아 온다(디스크를 공유하지 않으므로 경로 모드가 아니다).
      INFERENCE_TRANSFER: upload
      # X-Inference-Token 헤더. GPU PC 의 BESIDE_INFERENCE_TOKEN 과 같은 값.
      INFERENCE_TOKEN: ${INFERENCE_TOKEN:?deploy/.env 에 INFERENCE_TOKEN 을 넣는다}
      # (선택) Discord 웹훅: notify.webhook-url ↔ NOTIFY_WEBHOOKURL. 비면 알림 끔. 메시지의 관리 페이지 링크는 도메인 기준.
      NOTIFY_WEBHOOKURL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_PUBLICBASEURL: https://${BESIDE_DOMAIN:?deploy/.env 에 BESIDE_DOMAIN 을 넣는다}
      # (선택) GPU 알림에 붙는 서버 이름(예: Runpod A40): notify.inference-label ↔ NOTIFY_INFERENCELABEL. 비면 이름 없이.
      NOTIFY_INFERENCELABEL: ${NOTIFY_INFERENCE_LABEL:-}
      # Prometheus 지표의 공통 태그 env. 부하 시험 덮어쓰기는 loadtest 로 바꿔 운영 지표와 섞이지 않게 한다.
      METRICS_ENV: prod
      # 대표 사진 검사(202 전)와 크롭·배경 제거(추론 전): real,prod 기본 켬. 모델은 아래 /app/models 마운트.
      # deploy/.env 에서 false 로 끌 수 있다(끄면 deploy_vm.sh 가 모델을 받지 않는다).
      PREPROCESS_MODELSDIR: /app/models
      PREPROCESS_CHECK_ENABLED: ${PREPROCESS_CHECK_ENABLED:-true}
      PREPROCESS_CUTOUT_ENABLED: ${PREPROCESS_CUTOUT_ENABLED:-true}
      # (선택) 대기열 상한 — 안건 #21, 2026-11-21 결정(api-v1.1). 운영 .env 는 두지 않는다(꺼 둠). admission.max-pending ↔
      # ADMISSION_MAXPENDING, admission.retry-after-seconds ↔ ADMISSION_RETRYAFTERSECONDS. 기본 0 = 꺼짐(지금과 같다).
      # 켜는 법·값 규칙·형식 확인·되돌리기는 deploy/.env.example. 165 는 application.properties 의 기본값과 같게 둔다.
      ADMISSION_MAXPENDING: ${ADMISSION_MAX_PENDING:-0}
      ADMISSION_RETRYAFTERSECONDS: ${ADMISSION_RETRY_AFTER_SECONDS:-165}
      # ONNX Runtime 스레드마다 glibc arena 가 늘어 RSS 가 커지는 것을 막는다.
      MALLOC_ARENA_MAX: "2"
      # H2 DB 파일(beside-storage 의 db/beside-real.mv.db)이 없으면 시작하지 않는다(prod 기본, 장애 훈련 FD5: 빈 DB 를
      # 조용히 만들어 기존 작업이 모두 404 였다). 새 서버의 첫 시작만 셸에서 STORAGE_DB_CREATE_IF_MISSING=true 를 붙인다
      # (README 'VM 첫 설정' 6번). 잃은 DB 는 백업으로 되돌린다(docs/ops/RUNBOOK.md 'DB 복구').
      STORAGE_DB_CREATEIFMISSING: ${STORAGE_DB_CREATE_IF_MISSING:-false}
      # H2 온라인 백업(볼륨의 backup/beside-<시각>.zip)의 주기와 남길 개수: storage.backup.cron ↔ STORAGE_BACKUP_CRON,
      # storage.backup.keep ↔ STORAGE_BACKUP_KEEP. 기본값은 application-prod.properties 와 같다(매시 5분·48개, CI 가 같은지
      # 본다). 운영 VM 은 deploy/.env 에서 5분마다·288개(하루)로 둔다(.env.example, REDUNDANCY Phase 1-1). 그때는 VM 밖
      # 업로드도 5분 판으로 함께 설치한다(deploy/backup, README '운영 대응 설치' 4번).
      STORAGE_BACKUP_CRON: "${STORAGE_BACKUP_CRON:-0 5 * * * *}"
      STORAGE_BACKUP_KEEP: "${STORAGE_BACKUP_KEEP:-48}"
      # 분산 추적(W8, 2026-11-26): 작업 실행 하나의 트레이스(beside.job.run, 추론 서비스 호출 포함)와 HTTP 요청을 아래
      # tempo(monitoring 프로필)로 보낸다. management.otlp.tracing.endpoint ↔ MANAGEMENT_OTLP_TRACING_ENDPOINT: Spring Boot 3.2 는
      # 이 값이 있을 때만 내보낸다(application.properties). tempo 가 없으면 내보내기가 실패해 backend 가 ERROR 를 1분에 최대
      # 5줄 남기고(OpenTelemetry 의 SEVERE, 작업에는 영향 없음) Grafana '트레이스 내보내기 실패' 알림이 울린다. 그래서 배포는
      # tempo 먼저(README '로그 · 알림'). tempo 없이 오래 띄울 때는 deploy/.env 에 TRACING_SAMPLING_PROBABILITY=0 (span 은 안
      # 보내고 traceId 는 로그에 남음).
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    volumes:
      # H2 DB · uploads · results · preprocessed · events.jsonl · backup(prod 의 H2 백업 zip, STORAGE_BACKUP_*). 컨테이너를 지워도 남는다.
      - beside-storage:/app/storage
      # 전처리 모델(약 210 MB, scripts/fetch_models.sh 가 받는다). 이미지에 넣지 않고 읽기 전용으로 붙인다.
      - ${BESIDE_MODELS_DIR:-../backend/models}:/app/models:ro
    # 8080 은 compose 내부망에만 연다. 밖에서는 Caddy(80/443)로만 들어온다.
    # 8081 은 Actuator 관리 포트(/actuator/health, /actuator/prometheus): Prometheus 만 내부망에서 읽는다.
    # 둘 다 ports: 로 게시하지 않는다. Caddy 도 /actuator* 를 404 로 막는다(두 겹).
    expose:
      - "8080"
      - "8081"
    # 4GB VM 기준. 힙은 Dockerfile 의 -XX:MaxRAMPercentage=40 → 약 1.2GB, 나머지는 ONNX Runtime 의 네이티브 메모리
    # (YOLOX·U2Net 세션, 추정 0.6~1.0GB — VM 실측은 [계획])와 JVM 의 힙 밖 메모리. 2g 로는 모델이 들어갈 자리가 없다.
    mem_limit: 3g
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # 컨테이너에서 Tailscale(100.x) 주소가 안 닿으면(README '문제 해결') backend 를 호스트 네트워크로 옮긴다.
    #   backend: network_mode: host 를 넣고 expose 를 지운다. 환경변수 SERVER_ADDRESS: 127.0.0.1 과
    #            MANAGEMENT_SERVER_ADDRESS: 127.0.0.1 (8080·8081 을 VM 밖에 열지 않게).
    #   caddy:   backend:8080 이라는 이름이 더는 안 보이므로 caddy 도 network_mode: host 로 바꾸고 ports 를 지운 뒤,
    #            deploy/.env 에 BACKEND_UPSTREAM=127.0.0.1:8080 을 넣는다.
    #   prometheus·grafana 를 쓰면 이 둘도 network_mode: host 로 옮기고, monitoring/prometheus.yml 의 대상을
    #            127.0.0.1:8081, grafana 데이터소스를 127.0.0.1:9090, GRAFANA_UPSTREAM=127.0.0.1:3000 으로 바꾼다.
    #            호스트 모드에서는 ports: 게시가 적용되지 않고, 둘 다 기본값으로 VM 의 모든 주소에서 듣는다
    #            (Prometheus 0.0.0.0:9090, Grafana 3000). 8080·8081 처럼 루프백에만 두려면:
    #            prometheus: ports: 를 지우고 command 에 --web.listen-address=127.0.0.1:9090 을 더한다.
    #            grafana:    environment 에 GF_SERVER_HTTP_ADDR: 127.0.0.1 을 넣는다.

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. VM 방화벽에서 UDP 443 을 안 열어도 브라우저·앱은 TCP 443 으로 붙는다.
      - "443:443/udp"
    environment:
      BESIDE_DOMAIN: ${BESIDE_DOMAIN:?deploy/.env 에 BESIDE_DOMAIN 을 넣는다}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?deploy/.env 에 BASIC_AUTH_USER 를 넣는다}
      # bcrypt 해시의 $ 는 deploy/.env 에서 작은따옴표로 감싸야 그대로 들어온다(README '.env 채우기').
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?deploy/.env 에 BASIC_AUTH_HASH 를 넣는다}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8080}
      # /grafana* 의 대상. monitoring 프로필을 안 띄웠으면 인증 뒤 502 가 난다(다른 경로에는 영향 없음).
      GRAFANA_UPSTREAM: ${GRAFANA_UPSTREAM:-grafana:3000}
      # Go GC 의 메모리 목표(mem_limit 의 약 80 %). 이 값에 가까워지면 GC 가 더 자주 돌아 한도 전에 쓰레기를 치운다.
      GOMEMLIMIT: 1638MiB
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서·ACME 계정. 지우면 인증서를 다시 받는다(Let's Encrypt 발급 횟수 제한 주의).
      - caddy_data:/data
      - caddy_config:/config
    # 2026-11-18 부하 시험 A1(한도 없음): 1,800명 451 MiB, 3,600명 880 MiB, 5,400명 1,292 MiB, 7,200명 1,730 MiB,
    # 9,000명 2,170 MiB(드레인 중 2,246 MiB). 한도는 Caddy 가 늘어나 backend(3g)·OS 몫을 먹지 못하게 하려는 것이다:
    # 8GB VM 에서 한도 합(backend 3g + caddy 2g + monitoring 640m)은 약 5.6GB. 1g 였다면 한도 없이 1 GiB 를 넘은
    # 5,400명(평상시의 3배)부터 OOM 으로 컨테이너가 죽고 모든 연결이 끊길 수 있다[가설]. 9,000명이 GOMEMLIMIT 아래에서
    # 2g 안에 드는지는 다시 잰다[계획].
    mem_limit: 2g
    logging: *default-logging

  # ---- 모니터링 (선택): docker compose ... --profile monitoring up -d ----
  # 메모리 예산(한도 합): backend 3g + caddy 2g + prometheus 384m + grafana 256m + loki 384m + alloy 384m + tempo 384m
  # ≈ 6.75 GiB + OS(2026-11-26, 전에는 5.6GB). 지금 GCP VM(8GB)에는 들어간다. 4GB VM 이면 한도 합이 RAM 을 넘으므로
  # swap 2GB 가 꼭 필요하다(README '메모리'). backend 3g 는 전처리 모델(ONNX Runtime) 때문이다.

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 14일 또는 1GB 중 먼저 닿는 쪽에서 오래된 블록부터 지운다.
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=1GB
    volumes:
      # 파일 하나를 마운트하므로 git pull 로 바뀌면 restart prometheus 로 다시 읽힌다(Caddyfile 과 같다).
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 9090 은 VM 의 루프백에만 게시한다(인터넷에는 열지 않는다). 사람이 보는 곳은 Grafana(/grafana, Basic 인증 +
    # Grafana 로그인)이고, 부하 시험의 수집기(scripts/load/collect.py)와 중단 감시(lib/guard.js)는 개발 PC 에서
    # `ssh -L 9090:127.0.0.1:9090 <user@VM>` 터널로 http://localhost:9090 을 읽는다.
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 384m
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - prometheus
    # 관리자 비밀번호가 비면 Grafana 는 admin/admin 으로 뜬다. 그 대신 이유를 로그에 남기고 멈춘다.
    # (나머지는 이미지 원래 진입점 /run.sh 그대로.)
    entrypoint:
      - sh
      - -c
      - 'if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then echo "deploy/.env 에 GRAFANA_ADMIN_PASSWORD 를 넣는다" >&2; exit 1; fi; exec /run.sh'
    environment:
      # Caddy 가 https://<도메인>/grafana/ 를 접두사 그대로 넘긴다.
      GF_SERVER_ROOT_URL: https://${BESIDE_DOMAIN:?deploy/.env 에 BESIDE_DOMAIN 을 넣는다}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # 처음 뜰 때(빈 grafana_data) 만드는 관리자 계정. 나중에 .env 를 바꿔도 이미 만든 계정은 그대로다(README).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Caddy Basic 인증의 Authorization 헤더를 Grafana 가 자기 계정으로 검사하지 않게(Caddy 도 헤더를 지운다).
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 밖으로 나가는 사용 통계·업데이트 확인을 끈다.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Grafana 알림(provisioning/alerting/contact-points.yml)의 Discord 웹훅. 2026-11-26 결정으로 기본은 backend 알림과
      # 같은 팀 채널(NOTIFY_WEBHOOK_URL). 둘 다 비면 보내지 않는 자리 주소(Grafana 는 뜬다).
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-${NOTIFY_WEBHOOK_URL:-http://127.0.0.1:9/unset}}
    volumes:
      # 데이터소스(Prometheus)와 대시보드 'Beside 운영'을 파일로 넣는다. 폴더 마운트라 git pull 이 바로 보인다.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # 알림 규칙 13개(지표 10·로그 3) → Discord(2026-11-26). 웹훅은 위 GRAFANA_ALERT_WEBHOOK_URL.
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      # 사용자·세션·직접 만든 대시보드(SQLite).
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    mem_limit: 256m
    logging: *default-logging

  # ---- 로그 (monitoring 프로필, 2026-11-26): Alloy 가 Docker 로그 파일을 읽어 Loki 로 보낸다 ----
  # 왜: 로그는 서비스마다 json-file 50 MB 에서 지워져 부하 중에는 몇 분이면 사라지고, VM 과 함께 없어진다. 2026-11-25
  # 멘토링('로그를 서버로 보내 대시보드로', '부하 시험 중 로그가 튀는 정도'). Grafana 'Beside 로그' 대시보드가 이것을 본다.
  # 메모리: loki 384m + alloy 384m(2026-11-26 훈련 뒤 256m 에서 올림). tempo 까지 한도 합 약 6.75 GiB(8 GB VM). 공개 포트 없음.
  loki:
    image: grafana/loki:3.2.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    environment:
      # Go GC 가 한도의 약 80 % 에서 더 자주 돈다(caddy 와 같은 방식)
      GOMEMLIMIT: 300MiB
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    mem_limit: 384m
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.4.3
    profiles: [monitoring]
    restart: unless-stopped
    # Docker 의 로그 폴더는 root 만 읽는다(읽기 전용 마운트라 바꿀 수는 없다)
    user: "0"
    depends_on:
      - loki
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    environment:
      # 2026-11-26 스테이징 훈련: 부하가 없어도 230 MiB(옛 상한 256m)라 384m 으로 올렸다. 죽어도 알림이 없어 여유를 둔다.
      GOMEMLIMIT: 300MiB
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker 의 json-file 로그(읽기만). docker.sock 은 붙이지 않는다(읽기 전용이어도 사실상 root 권한).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy/data
    mem_limit: 384m
    logging: *default-logging

  # ---- 추적 (monitoring 프로필, 2026-11-26 W8): backend 가 보낸 트레이스를 받아 Grafana 에 보여 준다 ----
  # 왜: 작업 한 건의 시간이 어디에 쓰였는지(크롭·GPU 슬롯 대기·추론 서비스 호출·GLB 전송·저장) 한 화면에서 본다. 2026-11-25
  # 멘토링('로깅·모니터링·추적'). Grafana Explore → Tempo, 또는 Loki 로그 줄의 traceId 를 누른다(deploy/README '로그 · 알림').
  # single binary·로컬 디스크(볼륨 tempo_data)·보관 72시간. OTLP HTTP 4318 과 질의 3200 은 compose 내부망에만(ports 없음).
  # 메모리: 한도 합 약 6.75 GiB(README '메모리').
  tempo:
    image: grafana/tempo:2.6.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    environment:
      # Go GC 가 한도의 약 80 % 에서 더 자주 돈다(loki·caddy 와 같은 방식)
      GOMEMLIMIT: 300MiB
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4318"
    mem_limit: 384m
    logging: *default-logging

volumes:
  beside-storage:
    # 백업 명령에서 쓰는 이름을 고정한다(프로젝트 접두사 없이 beside-storage).
    name: beside-storage
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
