# Overlay for a server reachable from the internet (the VM): run with real,prod (prod last, so its values win).
# deploy/ (Caddy) also blocks these paths at the proxy; this file makes the server itself safe without the proxy.

# The H2 console runs SQL (and through it Java) as the server; a proxy on the same host makes callers look local.
spring.h2.console.enabled=false
# No generated API document or Swagger UI on the public server (the contract is docs/api/openapi.yaml).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Behind Caddy: honour X-Forwarded-* so any URL the server builds uses https and the public host.
server.forward-headers-strategy=framework
# Actuator stays on the internal management port (application.properties); health answers only UP/DOWN, no details.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Health is the database (and ping), not Spring's disk-space check (DOWN under 10 MB free): the VM watchdog
# (deploy/watchdog) restarts the backend when health stays DOWN, and a restart frees no disk while it ends every running
# job. The watchdog warns about the disk itself at 80 %. disk_free_bytes in /actuator/prometheus stays.
management.health.diskspace.enabled=false
# v1 photos must really be JPEG/PNG/WEBP (signature check), so junk fails at upload instead of in the GPU queue.
upload.verify-magic=true

# No H2 file, no start (failure drill FD5, 2026-11-20: with the file deleted H2 quietly made an empty database, health
# stayed UP and every job answered 404). Restore it from a backup (docs/ops/RUNBOOK.md 'DB 복구'); only a new server
# starts once with it true: the container's STORAGE_DB_CREATEIFMISSING, which deploy/docker-compose.yml takes from the
# shell's STORAGE_DB_CREATE_IF_MISSING (deploy/README.md 'VM 첫 설정'). The load-test overlay sets true: its volume is
# thrown away between runs.
storage.db.create-if-missing=false

# Hourly online copy of the H2 file (H2 BACKUP TO, consistent while running) to storage/backup/beside-<time>.zip, newest
# 48 (two days) kept. On the VM, deploy/backup/offsite_backup.sh copies each new zip to a GCS bucket at minute 20, so a
# lost disk costs at most about an hour of jobs (it was a day with the daily 04:30 copy on the same disk).
storage.backup.enabled=true
storage.backup.dir=storage/backup
storage.backup.keep=48
storage.backup.cron=0 5 * * * *
# The cron and the time in the file names are Korean time, whatever zone the container runs in (UTC).
storage.backup.zone=Asia/Seoul

# The GPU PC (a teammate's computer) may be off or still loading the model: real jobs then wait as PENDING for up to
# 30 min (rechecking /healthz every 5 s) instead of failing INFERENCE_UNAVAILABLE at once. Off (0) outside prod.
inference.offline-wait-ms=1800000
inference.offline-poll-ms=5000

# Discord (notify.webhook-url): a GPU "unreachable" is posted only once it has lasted 45 s (three /healthz checks at
# 15 s). The VM reaches the Runpod Pod over a Tailscale relay that missed one check on 2026-11-17 and was back 15 s
# later; that posts nothing now. Jobs still see the DOWN at once (they wait as above). Off (0) outside prod.
notify.down-grace-ms=45000

# Prod logs are one JSON object per line (logback-spring.xml). The ASCII banner would print several non-JSON
# lines at every start (a log server cannot parse them; a crash loop prints it each time).
spring.main.banner-mode=off
