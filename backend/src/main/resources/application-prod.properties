# Overlay for a server reachable from the internet (the VM): run with real,prod (prod last, so its values win).
# deploy/ (Caddy) also blocks these paths at the proxy; this file makes the server itself safe without the proxy.

# The H2 console runs SQL (and through it Java) as the server; a proxy on the same host makes callers look local.
spring.h2.console.enabled=false
# No generated API document or Swagger UI on the public server (the contract is docs/api/openapi.yaml).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Behind Caddy: honour X-Forwarded-* so any URL the server builds uses https and the public host.
server.forward-headers-strategy=framework
# v1 photos must really be JPEG/PNG/WEBP (signature check), so junk fails at upload instead of in the GPU queue.
upload.verify-magic=true

# Daily online copy of the H2 file (H2 BACKUP TO, consistent while running) to storage/backup/beside-<time>.zip, newest 7 kept.
storage.backup.enabled=true
storage.backup.dir=storage/backup
storage.backup.keep=7
storage.backup.cron=0 30 4 * * *
