server.port=8080

# Worker profile: mock (default) | real. Profile-specific settings live in application-{profile}.properties.
spring.profiles.default=mock

# storage dirs
storage.upload.dir=storage/uploads

# Job store: H2 file database. The file path comes from the profile (application-{mock,real}.properties) so mock and
# real jobs never mix. One server per database file: there is deliberately no AUTO_SERVER, a second instance fails fast
# instead of sharing (InterruptedJobRecovery would otherwise fail the other instance's running jobs).
# Tests override spring.datasource.url with an in-memory database (src/test/resources/config/application.properties).
spring.datasource.url=jdbc:h2:file:${storage.db.path:./storage/db/beside};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# update adds new tables/columns but never renames or drops. New entity fields must be nullable (boxed) types.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browser Mock MVP (v0) and API v1: up to 5 MB per photo and 20 MB per request.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# springdoc: document API v1 only. v0 /api/jobs is frozen and intentionally undocumented.
springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
