server.port=8080

# Worker profile: mock (default) | real. Profile-specific settings live in application-{profile}.properties.
spring.profiles.default=mock

# storage dirs
storage.upload.dir=storage/uploads

# Job store: H2 file database. The file path comes from the profile (application-{mock,real}.properties) so mock and
# real jobs never mix. One server per database file: there is deliberately no AUTO_SERVER, a second instance fails fast
# instead of sharing (InterruptedJobRecovery would otherwise fail the other instance's running jobs).
# Tests override spring.datasource.url with an in-memory database (src/test/resources/config/application.properties).
spring.datasource.url=jdbc:h2:file:${storage.db.path:./storage/db/beside};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# update adds new tables/columns but never renames or drops. New entity fields must be nullable (boxed) types.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Server measurement log (docs/METRICS.md §1): one JSON line per finished run. Empty value disables it (tests do).
storage.events.path=storage/events.jsonl

# Browser Mock MVP (v0) and API v1: up to 5 MB per photo and 20 MB per request.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# First-photo check before the 202 and cutout after it (docs/api/ERROR_CODES.md "대표 사진 검사", docs/METRICS.md
# checkMs / preprocess*). Off here (mock, tests); application-real.properties turns both on and prod inherits that.
# Thresholds are proposals (제안값) until the contract meeting; PreprocessProperties holds the same values.
# The models are not in the repository: scripts/fetch_models.* into models-dir (relative to backend/) or set
# PREPROCESS_MODELSDIR. With a step on and its model missing the server does not start (backend/models/README.md).
preprocess.models-dir=models
preprocess.check.enabled=false
preprocess.cutout.enabled=false
# Check: one photo at a time; a request that waits longer than wait-ms is accepted unchecked (checkResult SKIPPED:BUSY).
preprocess.check.max-concurrency=1
preprocess.check.wait-ms=3000
preprocess.check.decode-long-side=1600
preprocess.check.min-image-side=320
preprocess.check.min-animal-score=0.40
# A second dog or cat counts from the same score as the first (0.50 until 2026-11-05 let a real second dog at 0.48 pass).
preprocess.check.second-animal-score=0.40
preprocess.check.second-animal-min-area=0.15
preprocess.check.min-animal-px=224
preprocess.check.min-brightness=50
preprocess.check.brightness-percentile=0.90
preprocess.check.min-sharpness=50
preprocess.check.sharpness-px=512
# Cutout (real worker, before the inference slot): background remove = cut out, keep = crop and pad only.
preprocess.cutout.background=remove
preprocess.cutout.max-concurrency=1
preprocess.cutout.wait-ms=120000
preprocess.cutout.decode-long-side=2048
preprocess.cutout.margin=0.15
preprocess.cutout.fill=0.85
preprocess.cutout.max-side=1024
preprocess.cutout.min-foreground=0.05
preprocess.cutout.max-foreground=0.95
preprocess.cutout.largest-component-only=true
# Models (backend/models/README.md). input-size 0 = the model's own; class-ids are COCO indices (15 cat, 16 dog).
preprocess.detector.model=yolox_s.onnx
preprocess.detector.input-size=0
preprocess.detector.channel-order=BGR
preprocess.detector.legacy-normalize=false
preprocess.detector.decoded-output=false
preprocess.detector.class-ids=15,16
preprocess.detector.candidate-score=0.25
preprocess.detector.nms-iou=0.45
preprocess.detector.containment=0.7
preprocess.detector.threads=2
preprocess.detector.cpu-arena=true
preprocess.segmenter.model=u2net.onnx
preprocess.segmenter.input-size=320
preprocess.segmenter.mean=0.485,0.456,0.406
preprocess.segmenter.std=0.229,0.224,0.225
preprocess.segmenter.divide-by-max=true
preprocess.segmenter.output-index=0
preprocess.segmenter.sigmoid=false
preprocess.segmenter.threads=1
preprocess.segmenter.cpu-arena=true
# Decoding limits: header-first pixel cap (decoding bombs) and a time limit (slow progressive JPEGs).
preprocess.decode.max-pixels=67108864
preprocess.decode.max-webp-pixels=16777216
preprocess.decode.limit-ms=5000

# springdoc: document API v1 only. v0 /api/jobs is frozen and intentionally undocumented.
springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
