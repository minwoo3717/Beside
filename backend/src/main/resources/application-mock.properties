# Mock worker: no GPU. Waits pending-ms, moves to PROCESSING, waits processing-ms, then serves the sample GLB.
storage.result.sample=storage/results/sample-dog.glb
mock.worker.pending-ms=2000
mock.worker.processing-ms=3000
# Uploads whose original filename contains this token end as FAILED (error.code=INFERENCE_FAILED).
# Lets Unity test the failure UI and POST /api/v1/jobs/{id}/retry. Empty value disables the trigger.
mock.worker.fail-when-filename-contains=fail

# H2 database file of the mock profile (relative to the working directory, i.e. backend/ for bootRun). H2 needs the ./ prefix.
storage.db.path=./storage/db/beside-mock
# Browse it at http://localhost:8080/h2-console (localhost only): JDBC URL jdbc:h2:file:./storage/db/beside-mock, user sa, empty password.
spring.h2.console.enabled=true
