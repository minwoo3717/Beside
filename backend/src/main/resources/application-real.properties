# Real worker (PLAN stage 4): POST {inference.base-url}/infer on the Python inference service, then serve the GLB it made.
# Contract: generation/inference_service/README.md, docs/CONTRACT.md section 6.
inference.base-url=http://localhost:8001
# How photos and the GLB travel:
#   path   = absolute paths; Spring and Python share a filesystem (same PC or shared volume, scripts/run_real.ps1).
#   upload = no shared disk (Spring on a VM, the service on the GPU PC over Tailscale): POST /infer/upload with the photo
#            files, GET the answer's glbUrl, then DELETE /artifacts/{jobId} on the service (REVIEW_CHECKLIST #6 (b)).
inference.transfer=path
# Shared secret sent as the X-Inference-Token header in both modes; must equal BESIDE_INFERENCE_TOKEN of the service.
# Empty = no header (the service checks nothing unless BESIDE_INFERENCE_TOKEN is set). Pass it from the environment
# (INFERENCE_TOKEN=... or --inference.token=...), never commit a value here.
inference.token=
# No /infer answer within this time -> FAILED INFERENCE_TIMEOUT. Connecting has its own 5 s limit (INFERENCE_UNAVAILABLE).
# Upload mode: the GLB download has the same limit (CONVERSION_FAILED when exceeded).
inference.timeout-ms=600000
# /infer requests at a time (one GPU = 1). Other jobs wait as PENDING, so queuedMs measures the queue.
inference.max-concurrency=1
# The returned GLB is copied to {storage.result.dir}/{jobId}/base.glb and served by GET /api/v1/jobs/{id}/asset.
storage.result.dir=storage/results
# Upload mode: the GLB is downloaded to {storage.tmp.dir}/{jobId}/base.glb, copied as above, then deleted.
storage.tmp.dir=storage/tmp

# H2 database file of the real profile, kept apart from mock jobs.
storage.db.path=./storage/db/beside-real
# The measurement table job_runs (docs/METRICS.md 1.1) is read through the console inside this JVM: no other process
# may open the file while the server runs (no AUTO_SERVER). Only requests made on this machine reach it: H2 refuses other
# peers (web-allow-others stays false) and H2ConsoleGuardFilter answers 404 to anything a tunnel or proxy forwarded.
# http://localhost:8080/h2-console, JDBC URL jdbc:h2:file:./storage/db/beside-real, user sa, empty password.
spring.h2.console.enabled=true
