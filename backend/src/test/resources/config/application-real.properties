# Tests: the first-photo check and the cutout stay off. The main application-real.properties turns them on for the
# server, and a profile file beats config/application.properties, so this override is a profile file as well
# (PreprocessFlagsTest guards it). A test that needs a step sets it itself (@SpringBootTest(properties = ...)).
preprocess.check.enabled=false
preprocess.cutout.enabled=false
