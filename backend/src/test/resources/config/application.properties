# Test-only overrides. Spring Boot reads classpath:/config/application.properties after classpath:/application.properties,
# so only these keys change while every other main setting still applies. Do not set spring.datasource.url in a
# profile file (application-mock.properties): profile files would win over this one.
# Every Spring context gets its own in-memory H2, so tests never open the developer's database file (backend/storage/db).
spring.datasource.url=jdbc:h2:mem:beside-test-${random.uuid};DB_CLOSE_DELAY=-1
# No events.jsonl from tests unless a test points storage.events.path at its own temp file (JobEventsTest).
storage.events.path=
