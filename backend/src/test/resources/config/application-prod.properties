# Tests: as config/application-real.properties. With real,prod the prod files are read after the real ones, so a
# future main application-prod.properties that turns preprocessing on is also overridden here.
preprocess.check.enabled=false
preprocess.cutout.enabled=false
# Tests: no scheduled H2 backup. prod backs up every hour into storage/backup (relative to backend/), and a cached
# test context that is still alive at minute 5 would write a zip there. DatabaseBackupTest and
# DatabaseBackupScheduleTest turn it on themselves with a temp directory; the prod values are checked from the main
# file (DatabaseBackupScheduleTest.prodBacksUpEveryHourAndKeepsTwoDays).
storage.backup.enabled=false
