# Backend CI: Java tests (contract test included), browser Mock UI test, Docker image, compose/Caddy config.
# No deployment here: the VM is updated with scripts/deploy_vm.sh (deploy/README.md).
name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: gradle test + node test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: gradle test (JobV1ContractTest compares ../docs/api/openapi.yaml)
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: node test (browser Mock UI, API v1)
        run: node --test backend/src/test/js/mock-mvp.test.cjs

  docker:
    name: docker build + compose/Caddy config
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: docker build backend
        run: docker build -t beside-backend:ci backend

      - name: image starts as non-root and writes to /app/storage (real,prod, no inference service)
        run: |
          trap 'docker logs --tail 80 beside-smoke || true; docker rm -f beside-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name beside-smoke -p 127.0.0.1:18080:8080 \
            -e SPRING_PROFILES_ACTIVE=real,prod -e INFERENCE_BASEURL=http://127.0.0.1:9 beside-backend:ci
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:18080/api/v1/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/api/v1/healthz; echo
          # the compose healthcheck runs this inside the container
          docker exec beside-smoke curl -fsS -o /dev/null http://localhost:8080/api/v1/healthz
          docker exec beside-smoke id
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jRZkAAAAASUVORK5CYII=' | base64 -d > probe.png
          code="$(curl -s -o /dev/null -w '%{http_code}' -F 'photos=@probe.png;type=image/png' http://127.0.0.1:18080/api/v1/jobs)"
          echo "POST /api/v1/jobs -> $code"
          test "$code" = 202
          docker exec beside-smoke ls -la /app/storage /app/storage/uploads

      - name: compose file + .env.example (bcrypt $ survives single quotes)
        run: |
          compose=(docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example)
          "${compose[@]}" config -q
          want="$(sed -n "s/^BASIC_AUTH_HASH='\(.*\)'\$/\1/p" deploy/.env.example)"
          got="$("${compose[@]}" run --rm --no-deps -T caddy printenv BASIC_AUTH_HASH)"
          echo "want=$want"
          echo "got =$got"
          test -n "$want"
          test "$got" = "$want"

      - name: compose monitoring profile + load-test overlay (config, services, published ports, overlay values)
        run: |
          compose=(docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example)
          loadtest=(-f deploy/docker-compose.loadtest.yml)
          "${compose[@]}" --profile monitoring config -q
          "${compose[@]}" "${loadtest[@]}" config -q
          "${compose[@]}" --profile monitoring "${loadtest[@]}" config -q
          # prometheus and grafana start only with --profile monitoring
          test "$("${compose[@]}" config --services | sort | xargs)" = "backend caddy"
          test "$("${compose[@]}" --profile monitoring config --services | sort | xargs)" = "backend caddy grafana prometheus"
          "${compose[@]}" config --format json > compose-base.json
          "${compose[@]}" --profile monitoring config --format json > compose-monitoring.json
          "${compose[@]}" "${loadtest[@]}" config --format json > compose-loadtest.json
          python3 - compose-base.json compose-monitoring.json compose-loadtest.json <<'PY'
          import json
          import sys

          base, mon, lt = (json.load(open(path)) for path in sys.argv[1:4])
          # only caddy publishes ports: backend 8080/8081 (Actuator), prometheus 9090 and grafana 3000 stay internal
          for name, svc in mon["services"].items():
              if name != "caddy":
                  assert not svc.get("ports"), f"{name} publishes {svc.get('ports')}"
          assert mon["services"]["backend"]["environment"]["METRICS_ENV"] == "prod"
          for name, svc in mon["services"].items():
              assert svc.get("logging", {}).get("options", {}).get("max-size"), f"{name}: no log rotation"
          # the overlay swaps backend only: own volume, webhook and H2 backup off, env=loadtest, no production GPU URL/token
          be = lt["services"]["backend"]
          env = be["environment"]
          mounts = [(v.get("source"), v.get("target")) for v in be["volumes"]]
          assert mounts == [("beside-loadtest-storage", "/app/storage")], mounts
          want = {
              "SPRING_PROFILES_ACTIVE": "mock,prod",
              "METRICS_ENV": "loadtest",
              "STORAGE_BACKUP_ENABLED": "false",
              "MOCK_WORKER_PENDINGMS": "0",
              "MOCK_WORKER_PROCESSINGMS": "60000",
              "SPRING_TASK_EXECUTION_POOL_CORESIZE": "400",
              "INFERENCE_BASEURL": "http://127.0.0.1:9",
              "INFERENCE_TRANSFER": "upload",
          }
          for key, value in want.items():
              assert env.get(key) == value, f"{key}={env.get(key)!r}, want {value!r}"
          for key in ("NOTIFY_WEBHOOKURL", "INFERENCE_TOKEN"):
              assert env.get(key) in ("", None), f"{key} must be empty in the load-test overlay"
          assert lt["services"]["caddy"] == base["services"]["caddy"], "overlay changed caddy"
          assert set(lt["services"]) == set(base["services"]), sorted(lt["services"])
          print("monitoring profile and load-test overlay ok")
          PY

      - name: caddy validate deploy/Caddyfile
        run: |
          image="$(grep -m1 -oE 'caddy:[0-9][0-9.]*' deploy/docker-compose.yml)"
          hash="$(docker run --rm "$image" caddy hash-password --plaintext ci-dummy)"
          docker run --rm \
            -e BESIDE_DOMAIN=beside.example.com -e BASIC_AUTH_USER=ci -e BASIC_AUTH_HASH="$hash" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Caddy route rules (404 / 401 / public / 413)
        run: bash deploy/test_caddy_routes.sh
