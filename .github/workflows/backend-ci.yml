# Backend CI: Java tests (contract test included), browser Mock UI test, Docker image, compose/Caddy config.
# No deployment here: the VM is updated with scripts/deploy_vm.sh (deploy/README.md).
name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: gradle test + node test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: gradle test (JobV1ContractTest compares ../docs/api/openapi.yaml)
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: node test (browser Mock UI, API v1)
        run: node --test backend/src/test/js/mock-mvp.test.cjs

      - name: load-test tools (traffic model, collector, k6 scripts against stand-ins)
        run: |
          python3 -I -m unittest discover -s scripts/load -p "test_*.py"
          node --test scripts/load/*.test.mjs

      - name: VM operations scripts against stubs (watchdog, offsite backup, metadata block, GCP setup)
        run: |
          bash scripts/test_watchdog.sh
          bash scripts/test_offsite_backup.sh
          bash scripts/test_block_metadata.sh
          bash scripts/test_gcp_ops.sh
          bash scripts/test_clone_vm.sh
          bash scripts/test_failover_vm.sh
          bash scripts/test_sync_standby.sh

      - name: systemd units of deploy/backup and deploy/watchdog (systemd-analyze verify)
        run: |
          # The units start /usr/local/sbin/beside-*; verify copies pointing at the scripts under the runner's temp dir.
          units="$RUNNER_TEMP/units"
          mkdir -p "$units/sbin"
          install -m 755 deploy/backup/offsite_backup.sh "$units/sbin/beside-offsite-backup"
          install -m 755 deploy/backup/block-metadata.sh "$units/sbin/beside-block-metadata"
          install -m 755 deploy/watchdog/beside-watchdog.sh "$units/sbin/beside-watchdog"
          for unit in deploy/backup/*.service deploy/backup/*.timer deploy/watchdog/*.service deploy/watchdog/*.timer; do
            sed "s#/usr/local/sbin/#$units/sbin/#" "$unit" > "$units/$(basename "$unit")"
          done
          # beside-block-metadata.service needs docker.service; a stand-in keeps the check independent of the runner
          printf '[Unit]\nDescription=stand-in\n[Service]\nExecStart=/bin/true\n' > "$units/docker.service"
          cd "$units"
          systemd-analyze verify --man=no ./beside-*.service ./beside-*.timer

      - name: Runpod Pod scripts (start_pod.sh under its restart supervisor; fake service and Tailscale, no network)
        run: |
          for f in deploy/runpod/*.sh; do bash -n "$f"; done
          bash deploy/runpod/test_start_pod_supervisor.sh

  docker:
    name: docker build + compose/Caddy config
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: docker build backend
        run: docker build -t beside-backend:ci backend

      - name: image starts as non-root and writes to /app/storage (real,prod, no inference service)
        run: |
          trap 'docker logs --tail 80 beside-smoke || true; docker rm -f beside-smoke >/dev/null 2>&1 || true' EXIT
          # Preprocessing off: the image has no models (backend/models/README.md) and the 1x1 probe below is no pet photo.
          # A fresh volume: prod refuses to start without its H2 file (failure drill FD5) unless told to create it.
          docker run -d --name beside-smoke -p 127.0.0.1:18080:8080 \
            -e SPRING_PROFILES_ACTIVE=real,prod -e INFERENCE_BASEURL=http://127.0.0.1:9 -e STORAGE_DB_CREATEIFMISSING=true \
            -e PREPROCESS_CHECK_ENABLED=false -e PREPROCESS_CUTOUT_ENABLED=false beside-backend:ci
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:18080/api/v1/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/api/v1/healthz; echo
          # the compose healthcheck runs this inside the container
          docker exec beside-smoke curl -fsS -o /dev/null http://localhost:8080/api/v1/healthz
          docker exec beside-smoke id
          # the Dockerfile's USER beside (uid 10001): fail here if the container runs as anyone else, e.g. root
          test "$(docker exec beside-smoke id -u)" = 10001
          # OOM readiness (backend/Dockerfile): the JVM (PID 1) took the exit-on-OOM and heap-dump flags and started with
          # them; the dump goes to a file in the storage volume, which uid 10001 can write
          docker exec beside-smoke cat /proc/1/cmdline | tr '\0' '\n' > jvm-args.txt
          grep -qxF -- '-XX:+ExitOnOutOfMemoryError' jvm-args.txt
          grep -qxF -- '-XX:+HeapDumpOnOutOfMemoryError' jvm-args.txt
          grep -qxF -- '-XX:HeapDumpPath=/app/storage/backend-oom.hprof' jvm-args.txt
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jRZkAAAAASUVORK5CYII=' | base64 -d > probe.png
          code="$(curl -s -o /dev/null -w '%{http_code}' -F 'photos=@probe.png;type=image/png' http://127.0.0.1:18080/api/v1/jobs)"
          echo "POST /api/v1/jobs -> $code"
          test "$code" = 202
          docker exec beside-smoke ls -la /app/storage /app/storage/uploads
          # the upload folder was created by the server process, so it belongs to uid 10001 too
          test "$(docker exec beside-smoke stat -c %u /app/storage/uploads)" = 10001

      - name: preprocessing on without its models refuses to start (fails fast, says how to fix)
        run: |
          set +e
          out="$(timeout 180 docker run --rm -e SPRING_PROFILES_ACTIVE=real,prod -e INFERENCE_BASEURL=http://127.0.0.1:9 \
            -e STORAGE_DB_CREATEIFMISSING=true -e PREPROCESS_CHECK_ENABLED=true beside-backend:ci 2>&1)"
          code=$?
          set -e
          echo "$out" | grep -E "preprocess|APPLICATION FAILED" | tail -5
          echo "exit code $code"
          test "$code" -ne 0 && test "$code" -ne 124
          echo "$out" | grep -q "fetch_models"

      - name: prod without its H2 file refuses to start (failure drill FD5) and says how to restore
        run: |
          set +e
          out="$(timeout 180 docker run --rm -e SPRING_PROFILES_ACTIVE=real,prod -e INFERENCE_BASEURL=http://127.0.0.1:9 \
            -e PREPROCESS_CHECK_ENABLED=false -e PREPROCESS_CUTOUT_ENABLED=false beside-backend:ci 2>&1)"
          code=$?
          set -e
          echo "$out" | grep -E "H2 database file|APPLICATION FAILED" | tail -3
          echo "exit code $code"
          test "$code" -ne 0 && test "$code" -ne 124
          echo "$out" | grep -q "does not exist and storage.db.create-if-missing=false"
          echo "$out" | grep -q "docs/ops/RUNBOOK.md"   # ASCII only: the JVM may print Korean as ? without a UTF-8 locale

      - name: compose file + .env.example (bcrypt $ survives single quotes)
        run: |
          compose=(docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example)
          "${compose[@]}" config -q
          want="$(sed -n "s/^BASIC_AUTH_HASH='\(.*\)'\$/\1/p" deploy/.env.example)"
          got="$("${compose[@]}" run --rm --no-deps -T caddy printenv BASIC_AUTH_HASH)"
          echo "want=$want"
          echo "got =$got"
          test -n "$want"
          test "$got" = "$want"

      - name: compose monitoring profile + load-test overlay (config, services, published ports, overlay values)
        run: |
          compose=(docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example)
          loadtest=(-f deploy/docker-compose.loadtest.yml)
          "${compose[@]}" --profile monitoring config -q
          "${compose[@]}" "${loadtest[@]}" config -q
          "${compose[@]}" --profile monitoring "${loadtest[@]}" config -q
          # prometheus and grafana start only with --profile monitoring
          test "$("${compose[@]}" config --services | sort | xargs)" = "backend caddy"
          test "$("${compose[@]}" --profile monitoring config --services | sort | xargs)" = "alloy backend caddy grafana loki prometheus tempo"
          "${compose[@]}" config --format json > compose-base.json
          "${compose[@]}" --profile monitoring config --format json > compose-monitoring.json
          "${compose[@]}" "${loadtest[@]}" config --format json > compose-loadtest.json
          # a VM deploy/.env with the queue cap on (#21, decided 2026-11-21): .env.example has those lines commented out, so render
          # base and overlay once more with an env file that sets them (values unlike the defaults 0 and 165)
          { cat deploy/.env.example; echo; echo ADMISSION_MAX_PENDING=19; echo ADMISSION_RETRY_AFTER_SECONDS=300; } > capped.env
          capped=(docker compose -f deploy/docker-compose.yml --env-file capped.env)
          "${capped[@]}" config --format json > compose-capped.json
          "${capped[@]}" "${loadtest[@]}" config --format json > compose-loadtest-capped.json
          # a deploy/.env without the H2 backup lines (STORAGE_BACKUP_*, .env.example sets the VM's 5-minute values)
          grep -v '^STORAGE_BACKUP_' deploy/.env.example > nobackup.env
          docker compose -f deploy/docker-compose.yml --env-file nobackup.env config --format json > compose-nobackup.json
          python3 - compose-base.json compose-monitoring.json compose-loadtest.json compose-capped.json compose-loadtest-capped.json \
            compose-nobackup.json <<'PY'
          import json
          import sys

          base, mon, lt, capped, lt_capped, nobackup = (json.load(open(path)) for path in sys.argv[1:7])
          # only caddy publishes to the network: backend 8080/8081 (Actuator) and grafana 3000 stay internal,
          # prometheus 9090 is bound to the VM loopback only (SSH tunnel for scripts/load/collect.py)
          for name, svc in mon["services"].items():
              ports = svc.get("ports") or []
              if name == "caddy":
                  continue
              if name == "prometheus":
                  assert ports and all(p.get("host_ip") == "127.0.0.1" for p in ports), f"prometheus publishes {ports}"
                  continue
              assert not ports, f"{name} publishes {ports}"
          assert mon["services"]["backend"]["environment"]["METRICS_ENV"] == "prod"
          assert mon["services"]["backend"]["environment"]["PREPROCESS_CHECK_ENABLED"] == "true"
          # queue cap (REVIEW_CHECKLIST #21, decided 2026-11-21, off in production for now): off unless deploy/.env turns it on,
          # and the compose default Retry-After is the server's own default (application.properties)
          props = dict(line.split("=", 1) for line in open("backend/src/main/resources/application.properties", encoding="utf-8")
                       .read().splitlines() if "=" in line and not line.startswith("#"))
          assert mon["services"]["backend"]["environment"]["ADMISSION_MAXPENDING"] == "0"
          assert mon["services"]["backend"]["environment"]["ADMISSION_RETRYAFTERSECONDS"] == props["admission.retry-after-seconds"]
          # ... and when deploy/.env sets the two lines, both reach the backend
          got = {k: capped["services"]["backend"]["environment"].get(k) for k in ("ADMISSION_MAXPENDING", "ADMISSION_RETRYAFTERSECONDS")}
          assert got == {"ADMISSION_MAXPENDING": "19", "ADMISSION_RETRYAFTERSECONDS": "300"}, f"deploy/.env cap on: backend gets {got}"

          # prod does not start on a missing H2 file (failure drill FD5); only a new server overrides it from the shell
          assert mon["services"]["backend"]["environment"]["STORAGE_DB_CREATEIFMISSING"] == "false"

          # H2 backup schedule (REDUNDANCY Phase 1-1): without the deploy/.env lines compose passes the prod profile's own
          # values (what DatabaseBackupScheduleTest checks), and .env.example's 5-minute values reach the backend
          def key_values(path):
              return dict(line.split("=", 1) for line in open(path, encoding="utf-8").read().splitlines()
                          if "=" in line and not line.lstrip().startswith("#"))
          prod_props = key_values("backend/src/main/resources/application-prod.properties")
          example = key_values("deploy/.env.example")
          backup_keys = ("STORAGE_BACKUP_CRON", "STORAGE_BACKUP_KEEP")
          got = {k: nobackup["services"]["backend"]["environment"].get(k) for k in backup_keys}
          want_default = {"STORAGE_BACKUP_CRON": prod_props["storage.backup.cron"], "STORAGE_BACKUP_KEEP": prod_props["storage.backup.keep"]}
          assert got == want_default, f"compose defaults {got} differ from application-prod.properties {want_default}"
          got = {k: mon["services"]["backend"]["environment"].get(k) for k in backup_keys}
          assert got == {k: example.get(k) for k in backup_keys} == {"STORAGE_BACKUP_CRON": "0 */5 * * * *", "STORAGE_BACKUP_KEEP": "288"}, \
              f".env.example backup lines: backend gets {got}"

          def mem_bytes(value):
              # compose prints mem_limit as bytes; accept a unit suffix too, in case a version keeps "2g"
              text = str(value).strip().lower()
              for unit, size in (("gb", 1024**3), ("mb", 1024**2), ("kb", 1024), ("g", 1024**3), ("m", 1024**2), ("k", 1024), ("b", 1)):
                  if text.endswith(unit) and text[: -len(unit)].isdigit():
                      return int(text[: -len(unit)]) * size
              return int(text)

          def go_bytes(value):
              # GOMEMLIMIT syntax: a number with B, KiB, MiB or GiB
              for unit, size in (("GiB", 1024**3), ("MiB", 1024**2), ("KiB", 1024), ("B", 1)):
                  if value.endswith(unit):
                      return int(value[: -len(unit)]) * size
              return int(value)

          # Caddy has a memory cap (A1 load test: 2.2 GiB without one) and its Go GC aims at about 80 % of it
          caddy = base["services"]["caddy"]
          limit = mem_bytes(caddy.get("mem_limit", 0))
          assert limit == 2 * 1024**3, f"caddy mem_limit {caddy.get('mem_limit')!r}"
          gomem = go_bytes(caddy["environment"]["GOMEMLIMIT"])
          assert 0.75 <= gomem / limit <= 0.85, f"GOMEMLIMIT {caddy['environment']['GOMEMLIMIT']} vs mem_limit {limit}"
          assert mem_bytes(base["services"]["backend"]["mem_limit"]) == 3 * 1024**3, base["services"]["backend"]["mem_limit"]
          for name, svc in mon["services"].items():
              assert svc.get("logging", {}).get("options", {}).get("max-size"), f"{name}: no log rotation"
              # each json-file line carries the compose service name (attrs), for a log agent without docker.sock
              labels = svc["logging"]["options"].get("labels", "").split(",")
              assert "com.docker.compose.service" in labels, f"{name}: log lines without the service label ({labels})"
          # log pipeline (2026-11-26): alloy reads the json-file logs read-only, never docker.sock; loki and alloy have caps
          alloy = mon["services"]["alloy"]
          vols = [v.get("source", "") + ":" + v.get("target", "") for v in alloy.get("volumes", [])]
          assert not any("docker.sock" in v for v in vols), f"alloy mounts docker.sock: {vols}"
          assert any(v.get("target") == "/var/lib/docker/containers" and v.get("read_only") for v in alloy["volumes"]), vols
          for name in ("loki", "alloy", "tempo"):
              assert mem_bytes(mon["services"][name]["mem_limit"]) <= 384 * 1024**2, (name, mon["services"][name]["mem_limit"])
          # tracing (W8, 2026-11-26): tempo is internal only (no ports, checked above for every service), keeps its blocks
          # in a named volume, its Go GC aims at about 80 % of the cap, and the backend exports to it with every trace sampled
          tempo = mon["services"]["tempo"]
          assert any(v.get("source") == "tempo_data" and v.get("target") == "/var/tempo" for v in tempo["volumes"]), tempo["volumes"]
          assert 0.75 <= go_bytes(tempo["environment"]["GOMEMLIMIT"]) / mem_bytes(tempo["mem_limit"]) <= 0.85, tempo["environment"]
          benv = mon["services"]["backend"]["environment"]
          assert benv["MANAGEMENT_OTLP_TRACING_ENDPOINT"] == "http://tempo:4318/v1/traces", benv["MANAGEMENT_OTLP_TRACING_ENDPOINT"]
          assert benv["MANAGEMENT_TRACING_SAMPLING_PROBABILITY"] == "1.0", benv["MANAGEMENT_TRACING_SAMPLING_PROBABILITY"]
          assert "management.otlp.tracing.endpoint" not in props, "only compose sets the OTLP endpoint (tests and local runs export nothing)"
          # memory: the sum of the caps of the whole monitoring profile stays well inside the 8 GB VM (deploy/README '메모리')
          total = sum(mem_bytes(svc["mem_limit"]) for svc in mon["services"].values())
          print(f"sum of mem_limit with --profile monitoring: {total / 1024**3:.2f} GiB")
          assert total <= 7 * 1024**3, f"mem_limit sum {total / 1024**3:.2f} GiB"
          graf = mon["services"]["grafana"]
          assert any(v.get("target") == "/etc/grafana/provisioning/alerting" for v in graf["volumes"]), "grafana without alert rules"
          assert graf["environment"]["GRAFANA_ALERT_WEBHOOK_URL"], "grafana alert webhook empty"
          # the overlay swaps backend only: own volume, webhook and H2 backup off, env=loadtest, no production GPU URL/token
          be = lt["services"]["backend"]
          env = be["environment"]
          mounts = {v.get("target"): v for v in be["volumes"]}
          # storage is the load-test volume; the only other mount is the read-only preprocessing models
          assert sorted(mounts) == ["/app/models", "/app/storage"], sorted(mounts)
          assert mounts["/app/storage"].get("source") == "beside-loadtest-storage", mounts["/app/storage"]
          assert mounts["/app/models"].get("read_only") is True, mounts["/app/models"]
          want = {
              "SPRING_PROFILES_ACTIVE": "mock,prod",
              "METRICS_ENV": "loadtest",
              "STORAGE_BACKUP_ENABLED": "false",
              "STORAGE_DB_CREATEIFMISSING": "true",
              "MOCK_WORKER_PENDINGMS": "0",
              "MOCK_WORKER_PROCESSINGMS": "60000",
              "SPRING_TASK_EXECUTION_POOL_CORESIZE": "400",
              "INFERENCE_BASEURL": "http://127.0.0.1:9",
              "INFERENCE_TRANSFER": "upload",
              "PREPROCESS_CHECK_ENABLED": "false",
              "PREPROCESS_CUTOUT_ENABLED": "false",
          }
          for key, value in want.items():
              assert env.get(key) == value, f"{key}={env.get(key)!r}, want {value!r}"
          # queue cap off and the server's Retry-After whatever deploy/.env says: A2 seeds 1,000 PENDING jobs (#21,
          # decided 2026-11-21). Checked with the cap on in the env file too, else the base's own default 0 would pass
          # an overlay that lost these lines
          for label, doc in (("deploy/.env cap off", lt), ("deploy/.env cap on", lt_capped)):
              got = {k: doc["services"]["backend"]["environment"].get(k) for k in ("ADMISSION_MAXPENDING", "ADMISSION_RETRYAFTERSECONDS")}
              assert got == {"ADMISSION_MAXPENDING": "0", "ADMISSION_RETRYAFTERSECONDS": props["admission.retry-after-seconds"]}, \
                  f"load-test overlay, {label}: backend gets {got}"
          for key in ("NOTIFY_WEBHOOKURL", "INFERENCE_TOKEN"):
              assert env.get(key) in ("", None), f"{key} must be empty in the load-test overlay"
          assert lt["services"]["caddy"] == base["services"]["caddy"], "overlay changed caddy"
          assert set(lt["services"]) == set(base["services"]), sorted(lt["services"])
          print("monitoring profile and load-test overlay ok")
          PY

      - name: caddy validate deploy/Caddyfile
        run: |
          image="$(grep -m1 -oE 'caddy:[0-9][0-9.]*' deploy/docker-compose.yml)"
          hash="$(docker run --rm "$image" caddy hash-password --plaintext ci-dummy)"
          docker run --rm \
            -e BESIDE_DOMAIN=beside.example.com -e BASIC_AUTH_USER=ci -e BASIC_AUTH_HASH="$hash" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: log pipeline, traces and Grafana provisioning load (Loki config, Alloy syntax, Tempo, datasources, dashboards, alert rules)
        run: |
          img() { grep -m1 -oE "$1:[^\"[:space:]]+" deploy/docker-compose.yml; }
          docker run --rm -v "$PWD/deploy/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro" "$(img grafana/loki)" \
            -config.file=/etc/loki/loki.yml -verify-config
          docker run --rm -v "$PWD/deploy/monitoring/alloy/config.alloy:/tmp/config.alloy:ro" "$(img grafana/alloy)" \
            fmt /tmp/config.alloy > /dev/null
          # Tempo (W8, 2026-11-26): the config parses strictly with no warnings (-config.verify exits 1 on one), then the
          # image runs as compose runs it (named volume at /var/tempo, owned by its user 10001), gets ready, takes one
          # OTLP/HTTP span on 4318 and returns it by trace id on 3200
          docker run --rm -v "$PWD/deploy/monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro" "$(img grafana/tempo)" \
            -config.file=/etc/tempo/tempo.yml -config.verify=true
          docker volume create ci-tempo-data > /dev/null
          docker run -d --name ci-tempo -p 127.0.0.1:3201:3200 -p 127.0.0.1:4319:4318 \
            -v "$PWD/deploy/monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro" -v ci-tempo-data:/var/tempo \
            "$(img grafana/tempo)" -config.file=/etc/tempo/tempo.yml
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:3201/ready > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:3201/ready > /dev/null || { docker logs ci-tempo | tail -50; echo "tempo not ready"; exit 1; }
          trace=5b8efff798038103d269b633813fc60c
          now="$(date +%s%N)"
          span='{"traceId":"'"$trace"'","spanId":"eee19b7ec3c1b174","name":"beside.job.run","kind":1,"startTimeUnixNano":"'"$now"'","endTimeUnixNano":"'"$((now + 1000000))"'"}'
          curl -fsS -X POST http://127.0.0.1:4319/v1/traces -H 'Content-Type: application/json' \
            -d '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"beside-ci"}}]},"scopeSpans":[{"spans":['"$span"']}]}]}' > /dev/null
          for _ in $(seq 1 30); do curl -fs "http://127.0.0.1:3201/api/traces/$trace" | grep -q beside.job.run && break; sleep 1; done
          curl -fsS "http://127.0.0.1:3201/api/traces/$trace" | grep -q beside.job.run || { docker logs ci-tempo | tail -50; echo "span not found"; exit 1; }
          docker rm -f ci-tempo > /dev/null
          docker volume rm ci-tempo-data > /dev/null
          # Grafana starts with the same provisioning as the VM (no Prometheus/Loki behind it: only loading is checked)
          docker run -d --name ci-grafana -p 127.0.0.1:3300:3000 \
            -e GF_SECURITY_ADMIN_PASSWORD=ci-dummy -e GRAFANA_ALERT_WEBHOOK_URL=http://127.0.0.1:9/ci \
            -v "$PWD/deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro" \
            -v "$PWD/deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro" \
            -v "$PWD/deploy/monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro" \
            -v "$PWD/deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro" \
            "$(img grafana/grafana-oss)"
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:3300/api/health > /dev/null && break; sleep 2; done
          A=(-fsS -u admin:ci-dummy)
          curl "${A[@]}" http://127.0.0.1:3300/api/datasources | python3 -c 'import json,sys; u={d["uid"] for d in json.load(sys.stdin)}; assert {"beside-prometheus","beside-loki","beside-tempo"} <= u, u'
          # Loki lines link their traceId to Tempo, and Tempo's spans lead back to the job's Loki lines
          curl "${A[@]}" http://127.0.0.1:3300/api/datasources/uid/beside-loki | python3 -c 'import json,sys; d=json.load(sys.stdin)["jsonData"]["derivedFields"]; assert any(f["name"]=="traceId" and f.get("datasourceUid")=="beside-tempo" for f in d), d'
          curl "${A[@]}" http://127.0.0.1:3300/api/datasources/uid/beside-tempo | python3 -c 'import json,sys; t=json.load(sys.stdin)["jsonData"]["tracesToLogsV2"]; assert t["datasourceUid"]=="beside-loki" and "${__trace.traceId}" in t["query"], t'
          curl "${A[@]}" "http://127.0.0.1:3300/api/search?type=dash-db" | python3 -c 'import json,sys; u={d["uid"] for d in json.load(sys.stdin)}; assert {"beside-ops","beside-logs"} <= u, u'
          n="$(curl "${A[@]}" http://127.0.0.1:3300/api/v1/provisioning/alert-rules | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          want="$(grep -c '^      - uid: ' deploy/monitoring/grafana/provisioning/alerting/rules.yml)"
          test "$n" = "$want" || { docker logs ci-grafana | tail -50; echo "alert rules loaded: $n, in the file: $want"; exit 1; }
          docker logs ci-grafana 2>&1 | grep -iE 'level=error.*provision' && exit 1 || true
          docker rm -f ci-grafana > /dev/null
          echo "loki, alloy, tempo and grafana provisioning ok ($n alert rules)"

      - name: Caddy route rules (404 / 401 / public / 413)
        run: bash deploy/test_caddy_routes.sh
